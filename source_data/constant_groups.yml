no-three-in-line:
  name: "No-three-in-line problem"
  description: "$D(n)$ is the largest number of points of the $n \\times n$ grid that can be chosen with no three on a line, in any direction. Since each row holds at most two of them, $D(n) \\le 2n$. It's conjectured that $D(n) < 2n$ for all large $n$."
