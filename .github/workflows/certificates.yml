name: Certificates

# Checks that every certificate is well formed and either verified (its
# evidence hash matches an entry in certificates/verified.yml) or attested.
# It never runs the checkers on the evidence, or any code from a submission:
# a maintainer verifies new certificates locally with
# scripts/verify_certificates.py and adds them to the manifest.
on:
  pull_request:
    paths: &paths
      - "certificates/**"
      - "formal/**"
      - "scripts/**"
      - ".github/**"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Find new certificates
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- 'certificates/*/*.yml' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Check certificates
        env:
          NEW_FILES: ${{ steps.changed.outputs.files }}
        run: python scripts/check_certificates.py --new $NEW_FILES --summary certificate-summary.md

      - name: Show the summary
        if: always() && hashFiles('certificate-summary.md') != ''
        run: cat certificate-summary.md >> "$GITHUB_STEP_SUMMARY"

      # The Certificate comment workflow posts the summary on the pull request,
      # since this one can't write to pull requests from forks
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'pull_request' && hashFiles('certificate-summary.md') != ''
        with:
          name: certificate-summary
          path: certificate-summary.md

      - name: Flag changes to trusted files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          trusted=$(git diff --name-only "origin/$BASE_REF...HEAD" -- \
            formal/LeapsInBounds/Statements formal/lakefile.toml formal/lean-toolchain \
            formal/lake-manifest.json scripts .github)
          if [ -n "$trusted" ]; then
            echo "::warning::This PR changes files that define or check what certificates mean, so it needs careful review:"
            echo "$trusted"
          fi
