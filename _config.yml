# Site settings, available in templates as {{ site.title }} and so on.
# This file isn't reloaded by `bundle exec jekyll serve`: restart it after a change.

title: Leaps in Bounds
description: >-
  Repository of progress on mathematical unknowns
url: "https://leapsinbounds.org" # `jekyll serve` replaces this with the local address
baseurl: ""
repository: https://github.com/daniel-munro/leaps-in-bounds

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

# Not part of the site. The data in constants/, literature/ and certificates/
# reaches it through _data/ and data/, which scripts/build.sh generates.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - scripts/
  - constants/
  - literature/
  - certificates/
  - formal/
  - notes/
  - README.md
  - AGENTS.md
  - LICENSE
  - requirements.txt
