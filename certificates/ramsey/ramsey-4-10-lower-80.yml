notes: >-
  A circulant graph on 79 vertices (clique number 3, independence number 9): the cyclotomic circulant on Z79 with x ~
  y when x - y is in 3^0H, where H is the subgroup of the cubes mod 79, of index 3 in the multiplicative group. Found
  by an AI agent (Claude) in a bounded search over Paley and cyclotomic circulants of prime order, circulants whose
  connection sets are unions of multiplicative orbits, verified circulant witnesses, and their complements and
  lexicographic products, keeping the largest graph the checker verifies quickly.
