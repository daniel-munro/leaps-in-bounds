  Found by an AI agent (Claude) in a bounded search over Paley and cyclotomic circulants of prime order, circulants
  whose connection sets are unions of multiplicative orbits, verified circulant witnesses, and their complements and
  lexicographic products, keeping the largest graph the checker verifies quickly.
