notes: >-
  A circulant graph on 97 vertices (clique number 4, independence number 9): the cyclotomic circulant on Z97 with x ~
  y when x - y is in 5^0H, 5^1H, 5^4H, where H is the subgroup of the 8th powers mod 97, of index 8 in the
  multiplicative group. Found by an AI agent (Claude) in a bounded search over Paley and cyclotomic circulants of
  prime order, circulants whose connection sets are unions of multiplicative orbits, verified circulant witnesses,
  and their complements and lexicographic products, keeping the largest graph the checker verifies quickly.
