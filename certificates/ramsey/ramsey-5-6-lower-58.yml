notes: >-
  Downloaded from Geoffrey Exoo's Ramsey constructions page (https://isu.indstate.edu/ge/RAMSEY/g56.57, linked
  from r.5.6.html, which describes it as three 19-vertex circulant blocks with 141 edges recolored): a 0-1
  matrix of a 2-coloring of K57. The graph here is the complement of its 1-entries, with no 5-clique and no
  independent set of size 6. The current record, R(5,6) >= 59 (exoo-2023), has no published graph that could be
  found.
