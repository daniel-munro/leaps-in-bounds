# Current bounds that can't be certified yet, and why, so the same dead ends
# aren't tried again. See "Blocked bounds" in certificates/README.md.
#
# constants: the constants this applies to, for the same bound and reason.
# bound: lower or upper.
# reason: unpublished, too-large, needs-format, too-slow or out-of-reach.
# checked: when it was last looked into. If the bound improves after this
#   date, the entry is shown as stale, since the new bound may be certifiable.
# detail: what was checked and what's missing.
#
# A search that fell short of a record belongs in notes/<family>.md, not here.

- constants: [kissing-number-17, kissing-number-18, kissing-number-19, kissing-number-20, kissing-number-21]
  bound: lower
  reason: needs-format
  checked: 2026-10-30
  detail: >-
    The Cohn-Li records use irrational coordinates, and kissing number
    witnesses must have integer coordinates up to scaling (#26). Lattice
    witnesses certify weaker bounds.

- constants: [disk-covering-5, disk-covering-6, disk-covering-8, disk-covering-9, disk-covering-10,
    disk-covering-11, disk-covering-12, disk-covering-13, disk-covering-14, disk-covering-15,
    disk-covering-16, disk-covering-17, disk-covering-18, disk-covering-19, disk-covering-20,
    disk-covering-21, disk-covering-22, disk-covering-23, disk-covering-24, disk-covering-25]
  bound: upper
  reason: needs-format
  checked: 2026-11-16
  detail: >-
    Coverings are checked with rational arithmetic, so a witness can only
    certify a radius slightly above an optimal covering's, not the record
    itself (#74). Certifying the records needs exact arithmetic for algebraic
    radii.

- constants: [circle-in-square-10, circle-in-square-11, circle-in-square-13, circle-in-square-17,
    circle-in-square-19, circle-in-square-21, circle-in-square-22, circle-in-square-31,
    circle-in-square-33]
  bound: upper
  reason: needs-format
  checked: 2026-11-16
  detail: >-
    Packomania's coordinates for these packings aren't sums of rational
    multiples of square roots, so rounded packings certify slightly weaker
    bounds (#72). Certifying the records needs more general exact arithmetic.

- constants: [stamp-folding-16, stamp-folding-17, stamp-folding-18,
    stamp-folding-19, stamp-folding-20, stamp-folding-21, stamp-folding-22, stamp-folding-23,
    stamp-folding-24, stamp-folding-25, stamp-folding-26, stamp-folding-27, stamp-folding-28,
    stamp-folding-29]
  bound: lower
  reason: too-large
  checked: 2026-11-20
  detail: >-
    A witness lists every folding. A generator that prints them certifies n = 14
    and 15, but n = 16 (17,622,410 foldings of 17 bytes each) is 300 MB, over the
    200 MB the folding checker can read at once, and the count grows by about
    3.5 times per stamp. A checker that reads generator output as a stream would
    allow n = 16 and perhaps 17 (about 1 GB); beyond that, a lower bound could
    come from a Lean proof that counts the foldings.

- constants: [map-folding-2-11, map-folding-2-12, map-folding-2-13, map-folding-2-14, map-folding-2-15,
    map-folding-2-16, map-folding-2-17, map-folding-2-18, map-folding-3-7, map-folding-3-8,
    map-folding-3-9, map-folding-3-10, map-folding-3-11, map-folding-3-12, map-folding-3-13,
    map-folding-3-14, map-folding-4-6, map-folding-4-7, map-folding-4-8, map-folding-4-10,
    map-folding-5-5, map-folding-5-6, map-folding-5-7, map-folding-5-8, map-folding-6-6,
    map-folding-6-7, map-folding-7-7]
  bound: lower
  reason: too-large
  checked: 2026-11-20
  detail: >-
    A witness lists every folding. Generators that print them certify the counts
    up to 2 × 10 (9,381,840 foldings, 197 MB), 3 × 6 and 4 × 5, but the next
    counts are over the 200 MB the folding checker can read at once: 3 × 7 is
    21,582,624 foldings (475 MB), 2 × 11 is 51,081,844 (1.2 GB) and 4 × 6 is
    94,808,928 (2.1 GB). A checker that reads generator output as a stream might
    allow 3 × 7 and 2 × 11 within the hour; beyond that, a lower bound could
    come from a Lean proof that counts the foldings.
