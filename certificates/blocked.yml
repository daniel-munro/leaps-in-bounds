# Current bounds that can't be certified yet, and why, so the same dead ends
# aren't tried again. See "Blocked bounds" in certificates/README.md.
#
# constants: the constants this applies to, for the same bound and reason.
# bound: lower or upper.
# reason: unpublished, too-large, needs-format, too-slow or out-of-reach.
# checked: when it was last looked into. If the bound improves after this
#   date, the entry is shown as stale, since the new bound may be certifiable.
# detail: what was checked and what's missing.
#
# A search that fell short of a record belongs in notes/<family>.md, not here.

- constants: [kissing-number-17, kissing-number-18, kissing-number-19, kissing-number-20, kissing-number-21]
  bound: lower
  reason: needs-format
  checked: 2026-10-30
  detail: >-
    The Cohn-Li records use irrational coordinates, and kissing number
    witnesses must have integer coordinates up to scaling (#26). Lattice
    witnesses certify weaker bounds.

- constants: [disk-covering-5, disk-covering-6, disk-covering-8, disk-covering-9, disk-covering-10,
    disk-covering-11, disk-covering-12, disk-covering-13, disk-covering-14, disk-covering-15,
    disk-covering-16, disk-covering-17, disk-covering-18, disk-covering-19, disk-covering-20,
    disk-covering-21, disk-covering-22, disk-covering-23, disk-covering-24, disk-covering-25]
  bound: upper
  reason: needs-format
  checked: 2026-11-16
  detail: >-
    Coverings are checked with rational arithmetic, so a witness can only
    certify a radius slightly above an optimal covering's, not the record
    itself (#74). Certifying the records needs exact arithmetic for algebraic
    radii.

- constants: [circle-in-square-10, circle-in-square-11, circle-in-square-13, circle-in-square-17,
    circle-in-square-19, circle-in-square-21, circle-in-square-22, circle-in-square-31,
    circle-in-square-33]
  bound: upper
  reason: needs-format
  checked: 2026-11-16
  detail: >-
    Packomania's coordinates for these packings aren't sums of rational
    multiples of square roots, so rounded packings certify slightly weaker
    bounds (#72). Certifying the records needs more general exact arithmetic.

- constants: [stamp-folding-19, stamp-folding-20, stamp-folding-21, stamp-folding-22, stamp-folding-23,
    stamp-folding-24, stamp-folding-25, stamp-folding-26, stamp-folding-27, stamp-folding-28,
    stamp-folding-29]
  bound: lower
  reason: too-large
  checked: 2026-11-20
  detail: >-
    A witness lists every folding. Generators that print them certify n = 14 to
    18, read as a stream by the checker (n = 18, 185 million foldings, takes
    about 10 minutes), but the count grows by about 3.4 times per stamp: n = 19
    (623 million) would take most of an hour and about 15 GB of memory to count,
    and n = 20 is beyond the hour. A lower bound could come instead from a Lean
    proof that counts the foldings.

- constants: [map-folding-2-12, map-folding-2-13, map-folding-2-14, map-folding-2-15, map-folding-2-16,
    map-folding-2-17, map-folding-2-18, map-folding-3-8, map-folding-3-9, map-folding-3-10, map-folding-3-11,
    map-folding-3-12, map-folding-3-13, map-folding-3-14, map-folding-4-7, map-folding-4-8,
    map-folding-4-10, map-folding-5-5, map-folding-5-6, map-folding-5-7, map-folding-5-8, map-folding-6-6,
    map-folding-6-7, map-folding-7-7]
  bound: lower
  reason: too-large
  checked: 2026-11-20
  detail: >-
    A witness lists every folding. Generators that print them certify the counts
    up to 4 × 6 (94,808,928 foldings, 16 minutes on an otherwise idle machine),
    but the Python search that generates them finds about 100,000 foldings a
    second on one core, and less on a busy machine, while the checker waits at
    most an hour for a generator's output: 5 × 5 (186,086,600) and 3 × 8
    (201,060,768) took about an hour each with other jobs running, 2 × 12
    (266,680,992) would take longer, and 3 × 9 and 4 × 7 (over a billion)
    several hours. A faster generator might reach 5 × 5 to 2 × 12;
    beyond that, a lower bound could come from a Lean proof that counts the
    foldings.

- constants: [heilbronn-square-5, heilbronn-square-6, heilbronn-square-7, heilbronn-square-8,
    heilbronn-triangle-5, heilbronn-triangle-6, heilbronn-triangle-7]
  bound: upper
  reason: out-of-reach
  checked: 2026-11-21
  detail: >-
    The published proofs are long case analyses, several with symbolic or
    numerical computation (Zeng and Chen 2011 and 2019, Dehbi and Zeng 2022),
    and formalizing them in Lean is far beyond the trivial cases n = 3 and 4.
