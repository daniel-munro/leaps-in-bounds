notes: 'A generator that prints foldings of the 7 × 8 map, one stack per row from the bottom up, cells numbered row by row with two base-36 characters per cell, read by the checker as a stream. Written by an AI agent (Claude Opus 5.5). Each is a product of strip foldings: for foldings s of the strip of 8 stamps and t of the strip of 7, fold every row like s (reversed in odd rows) and then fold the strip of rows like t; or the same with rows and columns swapped. All 2 s(7) s(8) = 2 × 462 × 1392 = 1286208 of these products, which are distinct (the checker confirms it), half of each kind.'
