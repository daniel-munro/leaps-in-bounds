notes: 'A generator that prints foldings of the 6 × 13 map, one stack per row from the bottom up, cells numbered row by row with two base-36 characters per cell, read by the checker as a stream. Written by an AI agent (Claude Opus 5.5). Each is a product of strip foldings: for foldings s of the strip of 13 stamps and t of the strip of 6, fold every row like s (reversed in odd rows) and then fold the strip of rows like t; or the same with rows and columns swapped. The first 41000000 products of each kind (of 2 s(6) s(13) = 139943232 in all), in the order a depth-first search finds the strip foldings; the number is set so that checking takes about 5 minutes.'
