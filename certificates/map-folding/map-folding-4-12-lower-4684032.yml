notes: 'A generator that prints foldings of the 4 × 12 map, one stack per row from the bottom up, cells numbered row by row with two base-36 characters per cell, read by the checker as a stream. Written by an AI agent (Claude Opus 5.5). Each is a product of strip foldings: for foldings s of the strip of 12 stamps and t of the strip of 4, fold every row like s (reversed in odd rows) and then fold the strip of rows like t; or the same with rows and columns swapped. All 2 s(4) s(12) = 2 × 16 × 146376 = 4684032 of these products, which are distinct (the checker confirms it), half of each kind.'
