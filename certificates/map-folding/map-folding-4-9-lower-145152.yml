notes: 'A generator that prints foldings of the 4 × 9 map, one stack per row from the bottom up, cells numbered row by row in base 36. Written by an AI agent (Claude Opus 5.5). Each is a product of strip foldings: for foldings s of the strip of 9 stamps and t of the strip of 4, fold every row like s (reversed in odd rows) and then fold the strip of rows like t; or the same with rows and columns swapped. All 2 s(4) s(9) = 2 × 16 × 4536 = 145152 of these products, which are distinct (the checker confirms it), half of each kind. The output is 5.4 MB; generating and checking it takes about 1 minute on a heavily loaded machine.'
