notes: 'A generator that prints foldings of the 7 × 14 map, one stack per row from the bottom up, cells numbered row by row as decimals separated by commas. Written by an AI agent (Claude Opus 5.5). Each is a product of strip foldings: for foldings s of the strip of 14 stamps and t of the strip of 7, fold every row like s (reversed in odd rows) and then fold the strip of rows like t; or the same with rows and columns swapped. The first 350000 products of each kind (of 2 s(7) s(14) in all), in the order a depth-first search finds the strip foldings, as many as keep the output under the 200 MB limit for a checker that reads it all at once. The output is 198.8 MB; generating and checking it takes about 4 minutes on a heavily loaded machine.'
