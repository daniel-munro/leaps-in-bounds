notes: 'A generator that prints every folding of the 2 × 10 map, cells numbered row by row in base 36, one stack per row from the bottom up. Written by an AI agent (Claude Opus 5.5): a depth-first search that inserts the cells into the stack one at a time, in order, and abandons a partial stack as soon as two creases on the same edge cross; the gaps where each new cell can go are found by one scan of the nesting of the creases on each edge it adds a crease to. The count matches OEIS A001415. The output is 197.0 MB, which the generator prints in about 140 seconds; generating and checking it took about 19 minutes (8 minutes of CPU), with 2.6 GB of memory; the output is just under the 200 MB limit, on a heavily loaded machine.'
