notes: S(n) >= n - 1. If the comparators don't join the n wires into one connected component, putting 1 on one component and 0 on the rest (or the reverse) leaves some input unsorted, and a connected graph on n vertices has at least n - 1 edges. Proof written by an AI agent (Claude).
