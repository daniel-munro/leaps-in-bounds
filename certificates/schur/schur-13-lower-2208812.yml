notes: >-
  2208812 = 1242 * 1778 + 536. The coloring of schur-7-lower-1778 composed with a new S-template of width 1242
  with seven colors, whose special color has smallest element 537 (Definition 2.1 and Theorem 2.3 of Ageron et al.,
  arXiv:2112.03175). It gives S(k+6) >= 1242 S(k) + 536, where the published inequality is 1160 S(k) + 536. The
  template is the coloring of schur-7-lower-1778 restricted to 1, ..., 1242, with ten integers recolored (90, 92,
  97, 99, 108, 112, 133, 168, 551 and 1228). The recoloring was found by local search by Claude (AI agent,
  Anthropic), working with Lucas Masbatin, November 2026.
