notes: "Greenwood and Gleason's coloring of K_16: the vertices 0 to 15 are the elements of GF(16) = GF(2)[x]/(x^4 + x + 1), with the binary digits of each vertex as the coefficients of its polynomial, and the edge uv gets the coset of u + v in the multiplicative group modulo the cubes, so color i when u + v = x^j with j = i mod 3."
