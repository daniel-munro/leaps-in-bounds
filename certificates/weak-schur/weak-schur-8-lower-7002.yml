notes: >-
  A weak Schur partition of [1, 7002] into 8 sets: Rowley's second construction (rowley-2020, Theorem 1:
  WS(k+2) >= 13 S(k) + 8, from his partition of [1, 21] into {1, 2, 4, 8, 21}, {3, 5, 6, 7, 18, 19, 20} and [9, 17])
  applied to Adam McKenna's partition of [1, 538] into 6 sum-free sets ("The sixth Schur number is at least 538",
  Zenodo, 4 Nov 2026, doi:10.5281/zenodo.23937655, file schur6-538.word, colours renumbered in the order of their
  least elements). T_i = [13i - 4, 13i + 4] takes the colour of i for i in [1, 538]; {1, 2, 4} and 8 + 13j form the
  seventh colour, {3} and 5 + 13j, 6 + 13j, 7 + 13j the eighth. This improves the published WS(8) >= 6976 (Rowley,
  from S(6) >= 536). Built by our own script and checked by three programs of our own (a C bitset scan over each
  colour class, a NumPy FFT convolution and an exact number-theoretic transform modulo 2013265921), written by an AI
  agent (Claude, Anthropic) for Quantavane; each rejects a copy with one number recoloured.
