notes: >-
  Subgraph of the incidence graph of the biaffine plane over GF(16): points (x,y) with x in a fixed set of 16
  field elements, lines y = mx + b with m in a fixed set of 16 elements, giving a 16-regular bipartite graph
  of girth 6 on 2*16*16 = 512 vertices. Construction chosen by an AI agent (Claude).
