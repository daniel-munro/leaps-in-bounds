notes: >-
  A 6-regular graph of girth 9 on 5600 vertices: a cyclic lift (block circulant) of K_7 over Z_800. Vertex (u, a),
  u in 0..6 and a in Z_800, is vertex u*800 + a; each edge uv of K_7 with voltage x joins (u, a) to (v, a + x mod 800).
  The voltages were found by a tabu search over cyclic voltage assignments that counts the closed walks of length
  below 9 in K_7 with voltage sum 0; the search was written and run by an AI agent (Claude, Anthropic) for
  Quantavane. Checked by two separately written programs (breadth-first search from every vertex, and
  non-backtracking walk counts). The House of Graphs cage table had no entry for (6,9) on 7 Nov 2026.
