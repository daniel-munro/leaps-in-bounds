notes: >-
  A cyclic voltage lift of the Heawood graph over Z_110: vertex (u,a), u in 0..13 and a in Z_110, is vertex
  u*110 + a, and a base edge uv with voltage x joins (u,a) and (v,a+x mod 110). The voltages were found by a
  min-conflicts local search that counts closed non-backtracking walks shorter than 16 in the base graph with
  net voltage 0, written and run by an AI agent (Claude).
