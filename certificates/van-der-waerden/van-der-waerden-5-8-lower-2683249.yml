notes: 'Rabung''s construction with p = 383321, as a generator: integer x from 0 to 2683247 gets the discrete logarithm of x mod 383321 base 3, mod 5, and the multiples 0, 383321, ..., 2683247 of 383321 get colors 0, 1, 2, ... mod 5. No 8 cyclically consecutive residues mod 383321 have their nonzero members all the same color, so no progression with difference not divisible by 383321 is monochromatic, and the only one with difference divisible by 383321 is the multiples, which aren''t. 383321 is the largest prime = 1 mod 5 passing that test (a second each to test) below the size where r n^2 = 3.6 * 10^13, so that the checker takes about 20 minutes; the generator takes under a second. The record is far larger. Found by an AI agent (Claude Opus 5.5).'
