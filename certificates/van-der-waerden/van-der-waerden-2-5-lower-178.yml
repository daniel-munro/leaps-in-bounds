notes: 'Zipped Rabung construction: color each nonzero residue x mod 11 by the discrete logarithm of x base 2 mod 2, zip it to a coloring mod 22 (x gets the color of x mod 11, flipped when x is odd), then zip again to a coloring mod 44 (2i gets the color of i, 2i + 1 the flipped color of i + 6). Take 4 periods plus one integer, and color the multiples of 11 by backtracking search.'
