notes: 'Blankenship, Cummings and Taranchuk''s construction with p = 5, W(5,7) > 5 L for a 4-coloring of L integers with no monochromatic 7-term progression: integer 5q + j gets color c if c < j and c + 1 otherwise, where c is the color of q in the first 536656 integers of the coloring of van-der-waerden-4-7-lower-2284752. Every residue class mod 5 misses a different color, so a progression with difference not divisible by 5 isn''t monochromatic. Truncated so that r n^2 = 3.6 * 10^13 and the checker takes about 20 minutes (plain Rabung colorings of this size fail the window test for 5 colors and k = 7). The record is far larger. Built by an AI agent (Claude Opus 5.5) in a few seconds.'
