notes: 'Xu''s product construction (xu-2013, Theorem 4: W(4,7) >= 617 (W(2,7) - 1) + 1 = 2284752): integer x from 0 to 2284750 gets color a + 2b, where a is the discrete logarithm of x mod 617 base 3 mod 2 (0 for multiples of 617), and b is the color of the integer part of x / 617 in the 2-coloring of van-der-waerden-2-7-lower-3704. Then extended greedily by one integer at the end (2284751, a multiple of 617, gets color 1, which no other multiple of 617 has), one more than the theorem gives, and than van-der-waerden-4-7-lower-2284752. Built by an AI agent (Claude Opus 5.5) in a few seconds; the checker takes about 12 minutes.'
