notes: 'Rabung''s construction with p = 272131, as a generator: integer x from 0 to 2449179 gets the discrete logarithm of x mod 272131 base 2, mod 6, and the multiples 0, 272131, ..., 2449179 of 272131 get colors 0, 1, 2, ... mod 6. No 10 cyclically consecutive residues mod 272131 have their nonzero members all the same color, so no progression with difference not divisible by 272131 is monochromatic, and the only one with difference divisible by 272131 is the multiples, which aren''t. 272131 is the largest prime = 1 mod 6 passing that test (a second each to test) below the size where r n^2 = 3.6 * 10^13, so that the checker takes about 20 minutes; the generator takes under a second. The record is far larger. Found by an AI agent (Claude Opus 5.5).'
