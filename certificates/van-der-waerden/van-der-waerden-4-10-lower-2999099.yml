notes: 'Rabung''s construction with p = 333233, as a generator: integer x from 0 to 2999097 gets the discrete logarithm of x mod 333233 base 3, mod 4, and the multiples 0, 333233, ..., 2999097 of 333233 get colors 0, 1, 2, ... mod 4. No 10 cyclically consecutive residues mod 333233 have their nonzero members all the same color, so no progression with difference not divisible by 333233 is monochromatic, and the only one with difference divisible by 333233 is the multiples, which aren''t. 333233 is the largest prime = 1 mod 4 passing that test (a second each to test) below the size where r n^2 = 3.6 * 10^13, so that the checker takes about 20 minutes; the generator takes under a second. The record is far larger. Found by an AI agent (Claude Opus 5.5).'
