notes: 'Rabung''s construction with p = 345739, as a generator: integer x from 0 to 3457390 gets the discrete logarithm of x mod 345739 base 7, mod 3, and the multiples 0, 345739, ..., 3457390 of 345739 get colors 0, 1, 2, ... mod 3. No 11 cyclically consecutive residues mod 345739 have their nonzero members all the same color, so no progression with difference not divisible by 345739 is monochromatic, and the only one with difference divisible by 345739 is the multiples, which aren''t. 345739 is the largest prime = 1 mod 3 passing that test (a second each to test) below the size where r n^2 = 3.6 * 10^13, so that the checker takes about 20 minutes; the generator takes under a second. The record is far larger. Found by an AI agent (Claude Opus 5.5).'
