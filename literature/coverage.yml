  - "Most 2026 bounds are AI-assisted Lean proofs posted to the Superpermutators Google Group or submitted to the Superpermutation Almanac, not refereed. Several use native_decide (L(7) >= 5898, 5899 and 5900, L(8) >= 46134, L(9) >= 408470). L(7) >= 5900 isn't listed by the Almanac, which has 5899."
  - "Claims left out: V. Gheorghe's L(7) >= 5896 (2026-07-29), stated as conditional on his n = 6 proof, which Lebar's post treats as the previous best; Halfar's partial proof of L(7) >= 5901 (2026-10-28); C. Fritsch's claim that L(6) = 872 (Superpermutators, 2021-02), whose proof had acknowledged errors; Z. Hunter's 2019 draft lower bound, later completed as Hunter-Raudvere 2026."
  - "Egan's L(9) <= 408966 is dated by the creation date of his page (2018-10-20), whose original version wasn't seen. The 5906 for n = 7 is dated 2019-02-27 from Egan's page, though the group announcement is 2019-03-02. Coanda's YouTube comment wasn't read. Group posts are dated in UTC; the group shows US Central time."

affine-line-arrangements:
  status: complete
  reviewed: 2026-11-21
  sources: [oeis-a241600-lines-on-plane, finschi-2001, forcey-2025, finschi-catalog, bjorner-et-al-1993]
  gaps:
  - "Grünbaum, Arrangements and Spreads (1972), p. 4, cited by A241600, wasn't read (the archive.org copy is lending-only); it may give the counts for up to 4 or 5 lines before Finschi 2001."
  - "No literature lower bound for 8 or more lines is recorded. One of 460780 follows from the 460779 realizable rank-3 oriented matroids on 9 elements (Fukuda, Miyata and Moriyama 2012), plus all lines parallel, and Finschi's 4134940 could be lowered by at least 274 for the non-realizable ones, but no source states either."
  notes: "The family counts combinatorial types (see the formal statement), which is what Finschi's abstract types bound. A241600 is defined by rigid isotopy; its terms for up to 7 lines were computed as types, and the upper bounds for 8 or more lines bound A241600 only if isotopy classes and types agree there. Cutler, Karlsson and Sloane (arXiv:2511.15864, v4 2026-07-18), Forcey (arXiv:2504.11461) and the A241600 history were checked, with nothing new; A241600(8) = 4134940 was proposed on OEIS in May 2025 and withdrawn."

