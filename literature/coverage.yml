  sources: [shearer-golomb-table, babcock-1953, atkinson-hassenklover-1984, golomb-1972, garry-vanderschel-1998, distributed-net-ogr-24, distributed-net-ogr-25, distributed-net-ogr-26, distributed-net-ogr-27, distributed-net-ogr-28, wikipedia-golomb-ruler]
