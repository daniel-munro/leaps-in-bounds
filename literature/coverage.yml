  sources: [stevens-shantaram-1978, rabung-1979, beeler-oneil-1979, dransfield-marek-truszczynski-2003, dransfield-et-al-2004, landman-robertson-2004, herwig-et-al-2007, heule-2009, sat-delft-waerden-2011, rabung-lotts-2012, landman-robertson-2014, heule-2017, blankenship-c-t-2018, monroe-2016, monroe-2017, monroe-2019, monroe-2022, komkov-2016, komkov-2017-v1, komkov-2017-v2, komkov-2018-v3, komkov-2018-v4, komkov-2018, komkov-2020, irsi-tables-2026, irsi-2026-w10-3, baur-2026, mouhib-2026, kim-2026, amaru-2026, wikipedia-van-der-waerden]
  gaps:
  - "irsi-tables-2026 is dated 2026-09-30, the date IRSI's note (irsi-2026-w10-3) gives for the page; its W(4,6), W(5,6) and W(6,6) rows come from constructions of 2026-09-23 to 30 and may have been posted a few days earlier. The Wayback Machine has no copy of the page, and IRSI documents no earlier values for these rows."
  - "kim-2026's 4- to 6-colour bounds are printed to three significant figures (Tables 2 and 3); the exact values recorded are q x L from the constructions it lists, computed here (see its notes). The archive's data/records.json, which may give them exactly, wasn't read. Kim's W(6,6) length 676,235 and Pouly's Rabung atlas (github.com/Vulkin-prog/rabung-atlas32, data/derived/ATLAS_CATALOGUE_K3_K64.csv) are below the records for lengths up to 11; Pouly's Zenodo record (10.5281/zenodo.23337824) starts at length 12."
  - "W(8,3) > 83 and W(7,4) > 5,800 (monroe-2016) are recorded as the first bounds stated for these numbers, although they're below what fewer colors give (W(6,3) > 223, W(6,4) > 9,778); Komkov 2016 cites the fewer-color bounds instead. No bound for W(7,3) or W(9,3) is stated before komkov-2016."
  - "Heule's certificates for W(10,3) > 889 and W(8,3) > 511 were committed to https://github.com/marijnheule/vdWaerden on 2017-01-22 and 2017-02-05, before the paper (heule-2017); they're credited to the paper, since it isn't known when the repository became public. If it was public then, W(10,3) > 889 came before komkov-2017-v2's > 701."
  - "irsi-tables-2026's W(10,3) > 935 is dated 2026-09-30 from IRSI's own note (irsi-2026-w10-3); no archived copy of the page with > 935 was found."
  - "W(4,6) >= 157349 (monroe-2017, monroe-2022) is 1,132 x 139 + 1, using W(2,6) = 1132 where Xu's theorem uses W(2,6) - 1; Xu's theorem gives 157210, as in monroe-2019. Monroe's code (https://github.com/hmonroe/vdw) only searches Rabung primes, with and without zipping, so it doesn't explain the value, and v7's Table 2 gives no method for it. No construction for 157349 is known here, and W(5,6) >= 786741 depends on it."
  - "Landman and Robertson's 1st edition (2004, Table 2.2) has W(3,5) >= 1210, citing Rabung 1979, which gives only W(3,5) > 965; no source for it was found, so it's taken as an error and not recorded (Herwig et al. 2007 also call it untraceable)."
  - "Chvátal 1970 couldn't be obtained; W(2,3), W(2,4) and W(3,3) are credited to it from later citations (Stevens and Shantaram 1978, Beeler and O'Neil 1979), and any lower bounds it gives aren't recorded."
  - "Kouril's 2006 PhD thesis (University of Cincinnati) may be the first source of W(2,6) = 1132, now credited to Kouril and Paul 2008; not read."

