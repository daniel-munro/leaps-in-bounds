  - "Lower bounds from two-distance sets alone (every two-distance set is isosceles), such as the largest ones in R^4 to R^7 classified by Lisoněk 1997, aren't included where a larger isosceles set was known by then or no source states them as isosceles sets; n = 8 is the exception, where Lisoněk's 45-point set is optimal."

sorting-network-size:
  status: complete
  reviewed: 2026-11-23
  sources: [dobbelaere-sorting-networks, floyd-knuth-1970, van-voorhis-1971, bose-nelson-1962, batcher-1968, baddar-2009, valsalam-miikkulainen-2013, codish-et-al-2014, codish-et-al-2015, tomar-2026-v2]
  gaps:
  - "Floyd's 1964 memo, Batcher's 1964 Goodyear report and the 1970 SRI report of Kautz, Pease and Green are unpublished and weren't found (Kautz's 1969 IEEE article of the same name gives no sizes); their sizes come from Floyd and Knuth (1970), Table 1, and Van Voorhis (1971), Table 2. Batcher's sizes for 17 to 32 inputs are the g = 2 column of Van Voorhis's Table 2, which he calls 'Batcher's result' (p. 48); they're dated by the 1964 report, as Floyd and Knuth date his sizes for 10 to 16, though the report may give only some of them. The sizes Kautz, Pease and Green reported for 18 and 26 to 28 inputs, which Van Voorhis improved, aren't known."
  - "Knuth 1973 (Vol. 3, Section 5.3.4) and Van Voorhis's 1972 IEEE note on S(n) >= S(n-1) + ceil(log2 n) weren't read (paywalled); the lower bounds for 9 to 16 inputs from Van Voorhis's inequality are taken from Codish et al. (2014). Floyd and Knuth's Table 1 rows for Nelson (approx. 1956; the O'Connor-Nelson patent, issued the same month as Bose and Nelson's paper, gives no table) and for Floyd and Knuth (approx. 1964, published as a 1967 AMS Notices abstract, tying Batcher for 10 to 12 inputs) aren't recorded."
  - "The information-theoretic lower bounds ceil(log2 n!) are recorded as trivial, through Baddar (2009), for 5 to 8 and 10 to 32 inputs; Baddar's table gives 20 instead of 19 for 9 inputs, so none is recorded there. The lower bounds for 17 to 20 inputs are first stated, as far as found, by Codish et al. (2015), and for 21 to 32 by Dobbelaere's list (2018-01-02), though they follow from Van Voorhis's inequality and earlier bounds."
  - "The lower bounds for 13 to 32 inputs credited to Tomar (2026) rest on an unreviewed computer proof; Dobbelaere's list, which withdrew the same values on 2026-11-20 because Van Voorhis's 1972 two-value proof is invalid, doesn't cite it. Tomar's unreviewed sequels on Zenodo aren't recorded: S(13) = 45 (2026-10-21), S(14) >= 50 (2026-10-26), and S(15) >= 55, S(16) = 60 and S(20) >= 81 (2026-11-12), each with bounds one or two higher for the larger inputs."

sorting-network-depth:
  status: complete
  reviewed: 2026-11-22
  sources: [dobbelaere-sorting-networks, parberry-1991, bundala-zavodny-2013, ehlers-muller-2014, ehlers-muller-2015, codish-et-al-2015, baddar-2009, ehlers-2017, wang-2025]
  gaps:
  - "Knuth 1973 wasn't read: the depths for up to 16 inputs (networks by Shapiro, Van Voorhis and others, mostly unpublished) and the optimal depths for up to 8 are credited to it through Parberry's Table 1 and Bundala and Závodný's Fig. 2, so earlier dates for some of them may be missing."
  - "The depths from odd-even merging of smaller networks, 12 for 17 to 20 inputs, 13 for 21 to 24 and 14 for 25 to 32, were known before Baddar's thesis but are first stated, as far as found, in its Table 3.4 (2009), which dates them here. The bounds 12 for 17 and 18 and 13 for 21 and 22 aren't recorded, since Baddar and Batcher's own networks improved them by that date. Their technical reports TR-KSU-CS-2007-06 and TR-KSU-CS-2008-05 (the 22-input network, which Ehlers and Müller credit for 19 to 22 inputs <= 12) weren't found, and the 2009 Parallel Processing Letters paper wasn't read (paywalled). Ehlers 2017 (p. 17 and Table 2) confirms 13 as the best depth for 23 and 24 inputs before his 12."
  - "Lower bounds from monotonicity that no source states for each n aren't recorded, such as D(n) >= 9 for 21 to 32 inputs from Bundala and Závodný (2013)."

rectilinear-crossing:
  status: complete
  reviewed: 2026-11-23
  sources: [aichholzer-crossing-page-2001, aichholzer-crossing-page-2004-06, aichholzer-crossing-page-2004-08-11, aichholzer-crossing-page-2004-08-30, aichholzer-crossing-page-2004-11, aichholzer-crossing-page-2007-04, aichholzer-crossing-page-2007-06, aichholzer-crossing-page-2009, aichholzer-crossing-page-2011, aichholzer-crossing-page, harary-hill-1963, jensen-1971, guy-1972, thorpe-harris-1996, brodsky-durocher-gethner-2000, brodsky-durocher-gethner-2000b, aichholzer-aurenhammer-krasser-2002, aichholzer-krasser-2005, aichholzer-garcia-orden-ramos-2006, abrego-et-al-2011, cetina-et-al-2010, fabila-monroy-lopez-2014, oeis-a014540]
  gaps:
  - "For n <= 9: n = 6 and the drawings for n = 8 and 9 are credited to Harary and Hill 1963, n = 7 to Jensen 1971 (who says it was known, without a source), and the lower bounds for n = 8 and 9 to Guy 1972. Erdős and Guy 1973 was read and only restates Guy 1972. Guy 1960 (Nabla) and Guy 1967 weren't read; Guy 1960 may give the lower bound for n = 7 earlier."
  - "Singer 1971 (unpublished) was seen only through Brodsky, Durocher and Gethner (2000, 2000b). Jensen's upper bounds are computed from his formula. The recursive constructions of Singer and of Brodsky et al. give upper bounds for other n by formula; only those the sources state (n = 10 and 81) are recorded. Unpublished improvements by G. Exoo mentioned by Thorpe and Harris weren't found."
  - "The lower bounds for 28 <= n <= 33 first seen on Aichholzer's page of 2009-05-19 are credited to the page; neither 2008 ENDM paper by Ábrego et al. states them. Aichholzer et al.'s 2001 technical report wasn't found."
  - "Aichholzer's page is dated by its Wayback Machine captures (2002-2025): bounds first seen in the capture of 2007-04-30 may date from unarchived versions back to 2004-11, those of 2015-05-26 from 2012-10 on, and the lower bounds first seen on 2004-06-24 from 2003-01 on."

multicolor-ramsey-triangle:
  status: complete
  reviewed: 2026-11-19
  sources: [ejc-ds1-small-ramsey-numbers, ejc-ds1-r1-small-ramsey-numbers, ejc-ds1-r2-small-ramsey-numbers, ejc-ds1-r6-small-ramsey-numbers, ejc-ds1-r7-small-ramsey-numbers, fettes-kramer-radziszowski-2004, whitehead-1973, chung-1973, fredricksen-1979, exoo-1994, fredricksen-sweet-2000, amaru-2026]
  gaps:
  - "Folkman 1974 wasn't read; Whitehead 1973 proves the same R_4(3) <= 65 from Folkman's notes. Golomb and Baumert 1965 (R_4(3) >= 46, via S(4) = 44), Sánchez-Flores 1995 and Wan 1997 were read only through Fettes-Kramer-Radziszowski 2004 and zbMATH reviews."
  - "Chung's recurrence R_{k+1}(3) >= 3R_k(3) + R_{k-2}(3) - 3 implies R_5(3) >= 156 (1973) and, with Fredricksen 1979, R_6(3) >= 491 before Exoo's 500, but no source states them, so they aren't recorded."
  - "R_4(3) <= 62 was claimed in Kramer's unpublished 1994 manuscript and announced in DS1 revision 7 (2000-07-25), but is dated by the 2004 journal paper. Xu, Xie and Chen 2002 (Mathematics in Economics 19, in Chinese, not found) give R_k(3) <= k!(e - 1/6) + 1, the same values as the FeKR-derived bounds for k = 5 to 9."
  - "The 2026 Schur preprints imply R_8(3) >= 5364, 5374 and 5384 by R_k(3) >= S(k) + 2, but no source states them, so they aren't recorded."

chromatic-number-space:
  status: complete
  reviewed: 2026-11-23
  sources: [gardner-1960, hadwiger-1961, larman-rogers-1972, hadwiger-1945, raiskii-1968, szekely-wormald-1989, cantwell-1996, raigorodskii-2001, nechushtan-2002, radoicic-toth-2003, ivanov-2006, coulson-payne-2007, cibulka-2007, kupavskii-raigorodskii-2009, kupavskii-raigorodskii-2009-endm, exoo-ismailescu-2014, kahle-taha-2014, cherkashin-kulikov-raigorodskii-2015, polymath16-2018-05, arman-bondarenko-prymak-radchenko-2021, parts-2026-03, ivanov-glushkova-2026, davies-2026, koshelev-kupavskii-voronov-2026]
  gaps:
  - "Coulson 1997 and 2002 (chi(R^3) <= 18 and 15) and Cibulka 2008 (Geombinatorics) weren't read; Coulson's bounds are as later papers credit them, and Cibulka's chi(R^6) >= 11 is credited to his 2007 thesis, which was read."
  - "chi(R^2) >= 4 is credited to Gardner's column (Scientific American, October 1960), which reports it from Leo Moser without proof; it is the earliest publication found. Moser and Moser's Problem 10 in the Canadian Mathematical Bulletin, whose part (b) asserts a 7-point set that can't be 3-colored, was posed in an earlier issue that wasn't found, and may predate Gardner; only the solution (vol. 4, 1961) was read. Soifer credits the bound to Nelson in November 1950, unpublished."
  - "Larman and Rogers's chi(R^10) >= 19, chi(R^11) >= 19 and chi(R^12) >= 24 come from Lemma 18, in a note added in proof, which gives a formula for 10 <= n <= 22 rather than the numbers; the values are computed from it (Kupavskii and Raigorodskii credit it with 19 and 24 for n = 10 and 12)."
  - "Cherkashin, Kulikov and Raigorodskii (2015) cite Kupavskiy (Discrete Math. 311, 2011) for chi(R^11) >= 25, but that paper is about other norms and has no such bound; 25 is credited to Kupavskii and Raigorodskii's EuroComb note (2009, Remark 2). Exoo and Ismailescu (2014) give chi(R^11) >= 24, citing Kupavskii and Raigorodskii's paper on R^9, which gives only 23."
  - "Bounds that follow from a lower dimension by monotonicity aren't recorded unless a source states them for that dimension."
  - "Arman, Bondarenko, Prymak and Radchenko (2021) report chi(R^6) <= 448 from the fifth Polymath16 thread, but the thread's best is Gibbs's 462 (2018-05-25), which the Polymath16 wiki still listed in 2022, so 448 is left out."
  - "Most current bounds are unrefereed 2026 work: OpenAI's chi(R^2) >= 6, Koshelev, Kupavskii and Voronov's chi(R^3) >= 7, which assumes OpenAI's Haar rigidity theorem, Davies's lower bounds for n >= 4, Ivanov and Glushkova's upper bounds, and Parts's arXiv note and blog comments."
  - "Carson Crocker posted the argument for chi(R^3) >= 7 on Zenodo and the Polymath16 blog on 2026-10-10, a day before Koshelev, Kupavskii and Voronov, but later disclaimed priority (blog comment of 2026-11-01); the bound is credited to them."
  - "Left out: Voronov's chi(R^4) >= 10 and chi(R^5) >= 10, known only as personal communications cited by Davies (2026); Parts's blog comment of 2026-01-25 that he had reached chi(R^8) >= 22 (no construction given; his paper of 2026-03-15 gives 25), and his unpublished chi(R^8) >= 20 from about 2022."
  - "Upper bounds for n >= 5 before Polymath16 and Arman, Bondarenko, Prymak and Radchenko come only from Larman and Rogers's asymptotic (3+o(1))^n; Arman et al. and Kupavskii and Raigorodskii (2009) say small-dimensional upper bounds were almost unstudied."

moving-sofa:
  status: complete
  reviewed: 2026-11-19
  sources: [wagner-1976, guy-1977, gerver-1992, romik-2016, kallus-romik-2017, baek-2024]
  gaps:
  - "Hammersley 1968 (Bull. Inst. Math. Appl. 4, 66-85) isn't online; its bounds are taken from Wagner 1976 and Gerver 1992, and Wagner says the proof of 2√2 appeared in an editorial commentary in the same bulletin in 1969 (vol. 5, 80-81)."
  - "The Shephard piano, which Gerver 1992 says slightly improved Hammersley's sofa in the late 1960s, was never published and has no reported area. Romik 2016 reports, from Stewart (2004), that B. F. Logan found Gerver's shape in 1976 but didn't publish it."

lebesgue-universal-cover:
  status: complete
  reviewed: 2026-11-22
  sources: [sprague-1936, brass-sharifi-2005, baez-bagdasaryan-gibbs-2015, gibbs-2018, xie-2026]
  gaps:
  - "No copy of Pál 1920 was found; his cover and lower bound are taken from Sprague 1936 and Brass and Sharifi 2005."
  - "Sprague 1936 doesn't compute his cover's area. The 0.844137708436 used is from Baez, Bagdasaryan and Gibbs 2015; Hansen 1975 and 1992 give 0.844144... and 0.84414, and Meschkowski 1960, who first computed it according to Brass and Sharifi, wasn't read."
  - "Hansen 1975 (Geometriae Dedicata 4, 165-172) cut about 10^-19 from Sprague's cover, too little to record at the digits known; it isn't in the history."
  - "Gibbs, A new slant on Lebesgue's universal covering problem (arXiv:1401.8217, 2014), claims a proved upper bound of 0.844113 (0.8441121 at a slant angle of 0.54°, Section 8). It isn't recorded: Baez, Bagdasaryan and Gibbs 2015, with Gibbs as an author, claim only 0.8441153 a year later, and Gibbs 2018 describes the 2014 paper as a computational study."
  - "Duff 1980 (C. R. Math. Rep. Acad. Sci. Canada 2, 37-42) gives a smaller non-convex cover, of area 0.84413570 according to Gibbs 2014; the non-convex variant isn't tracked."


tammes:
  status: complete
  reviewed: 2026-11-23
  sources: [cohn-spherical-codes, tammes-1930, fejes-toth-1943, rutishauser-1945, schutte-van-der-waerden-1951, van-der-waerden-1952, jucovic-1959, robinson-1961, danzer-1986, szekely-1974, tarnai-gaspar-1983, bachoc-vallentin-2008, musin-tarasov-2010, musin-tarasov-2014, musin-tarasov-2014-steklov]
  gaps:
  - "Fejes Tóth 1942 (Mat. Term. Ért. 61), Robinson's 1959 abstract, Strohmajer 1963, Goldberg 1965, 1967 and 1969, Karabinta 1973, Karabinta and Székely 1973, Böröczky 1983, Böröczky and Szabó 2003, Tarnai and Gáspár 1991, Clare and Kepert 1986, Kottwitz 1991 and Lazić, Šenk and Šeškar 1987 couldn't be read (paywalled, blocked or not online); their bounds are cited through the sources that report them. Danzer's 1963 Habilitationsschrift is read in its 1986 translation."
  - "Lower-bound histories for N <= 30 now start from Székely's 1974 table of the best arrangements known (szekely-1974, Tables 1 and 2), which gives the earlier records for N = 21, 23, 25, 26 and 28-30. What came between it and the current records (Clare and Kepert 1986, Lazić, Šenk and Šeškar 1987, Kottwitz 1991, Tarnai and Gáspár 1991) isn't known: Clare and Kepert 1986, Tarnai and Gáspár 1991 and Kottwitz 1991 may also give arrangements that improved on Székely without being the current record; reading them would fill any such steps."
  - "No record before the current one is known for N = 19 and 22. Székely gives no value for 19, saying (footnote 5, citing Bornemissza's unpublished 1968 thesis) that Goldberg's 1967 arrangement of 19 points (Elem. Math. 22, 108-110) is wrong. For 22 he lists 45° 1' from Goldberg 1969, which is above the best known value (44.7402°), so it isn't recorded. Before Székely, the earliest records known are Jucovič 1959 for N = 17 and 25, Strohmajer 1963 (Kólya) for 18, and Goldberg 1967 for 26, 27 and 30; Jucovič says his values beat those published before, which aren't named; he cites Molnár 1953 (Mat. Lapok 4, 113-123), which gives arrangements for all n <= 220, and that may hold earlier records."
  - "Székely credits the 23-point value (43° 41' 26.7\", equal to the 24-point snub cube's) to Robinson 1961, so it's cited that way, though it follows from Schütte and van der Waerden's 1951 arrangement of 24 points by removing one."
  - "The 17-point configuration is credited to Danzer's 1963 Habilitationsschrift, following Tarnai and Gáspár 1983, who say Danzer found it but didn't compute its edge length; the value is the one in Cohn's table. Karabinta's 1973 thesis (51° 5' for 17 points, the value in Székely's Table 2) doesn't improve on it, so it isn't a row."
  - "The upper bounds from Fejes Tóth's formula (N = 5-30) and from Robinson's Theorem Ba (N = 14-23) and Section 9.5 (N = 25-30) are computed from the general inequalities, which the papers don't evaluate for these N. Székely 1974 lists no upper bounds."
  - "Tammes 1930 is taken as the first to show T(5) = T(6) = 90°, with a sketched but correct argument. Böröczky's 1983 proof for N = 11 isn't a row, since Danzer's 1963 Theorem I already solves N = 10 and 11."
  - "bachoc-vallentin-2008 is dated to the journal; its Tammes table first appeared in arXiv:math/0608426v2 on 2006-10-17. tarnai-gaspar-1983 is dated to its publication (March 1983), not its receipt (1982-07-13). jucovic-1959 is dated to its publication, not its receipt (1958-01-27)."
  - "Kępiński's 2026 computer-assisted proof candidate for N = 16 (Zenodo 10.5281/zenodo.23312437) is conditional on unproved computations by its own account, so T(16) isn't recorded as exact."

heilbronn-square:
  status: complete
  reviewed: 2026-11-24
  sources: [stead-heilbronn-square, friedman-heilbronn-square, friedman-heilbronn-square-2006, friedman-heilbronn-square-2009, goldberg-1972, kung-1970, yang-zhang-zeng-1991-five, yang-zhang-zeng-1992, comellas-yebra-2002, dehbi-zeng-2022]
  gaps:
  - "The Chinese Ann. Math. 1992 paper was read only through its zbMATH review, and the Bielefeld preprint 91-074 (1991, by its title an earlier version of it) isn't online. The ICTP preprint IC/91/252 (August 1991), read in full, proves H(5) = √3/9 and reports H(6) = 1/8 and H(7) >= 1/12 from the 1992 paper, so those are dated August 1991 at the latest. H(6) <= 1/8 is credited to Yang and Zhang 1980 (The six-point problem in the square, in Chinese), which isn't online, on IC/91/252's statement that it first solved the problem. Dress, Yang and Zeng 1995, which Friedman's page and Sudermann-Merx credit with H(6) = 1/8, proves H(6)(K) <= 1/6 for planar convex bodies by its zbMATH review, so it isn't cited."
  - "Tal's 2009 Technion MSc thesis (Algorithms for Heilbronn's Triangle Problem, report MSC-2009-08) couldn't be reached: its PDF is gone from the Technion site and isn't archived. The Wolfram Demonstration Heilbronn Triangles in the Unit Square (archived 2019) credits Tal with the best known configurations for n = 17 to 22, so records for those n from 2009, before Stead's 2026 histories, are missing. Friedman's pages (archived 2009 to 2025) show no Tal records for n <= 16."
  - "Bounds for n >= 17, and the 2026 steps for n = 13 and 15, come from the record histories in Stead's tables, dated to the month, keeping only the best bound each month. Records reported without coordinates (n = 18, 21 and 26 in August 2026) are included as the tables list them."
  - "No upper bounds besides 1/(n - 1) are recorded for n >= 9. Sudermann-Merx (arXiv:2603.11107) solves n = 9 and 10 to global optimality within solver tolerances, and Ethan Hendren posted an AI-assisted computer proof for n = 9 on 2026-11-13; neither is accepted as a proof yet. The trivial bound H(n) <= H(8), stronger for n <= 14, isn't recorded."
  - "Stead's tables go to n = 100; only n <= 36 are tracked here."

heilbronn-triangle:
  status: complete
  reviewed: 2026-11-23
  sources: [stead-heilbronn-triangle, stead-heilbronn-triangle-2026-09-10, stead-heilbronn-triangle-2026-10-04, friedman-heilbronn-triangle, friedman-heilbronn-triangle-2006, friedman-heilbronn-triangle-2007, peng-1989, soifer-1988, chen-zeng-zhou-2013, de-comite-delahaye-2009, zeng-chen-2019, novikov-et-al-2025-alphaevolve]
  gaps:
  - "Yang, Zhang and Zeng 1994 (Acta Math. Sinica 37(5), doi:10.12386/A1994sxxb0084), for H(6) <= 1/8, is behind a bot check on the journal's site and couldn't be obtained by hand either, so it hasn't been read. Their Bielefeld preprint 91-098 (1991), for the n = 6 configuration, is listed in the SFB 343 index but isn't online; neither is credited from a reading."
  - "Bounds for n >= 17, and the 2026 steps for n = 16 to 35, come from Stead's current tables and Wayback snapshots of them (2026-09-10, 2026-10-04 and 2026-10-18), dated to the month, keeping only the best bound each month. Records for n >= 17 before the earliest snapshot (2026-09-10) aren't known, and the snapshots disagree on whether n = 19 and 22 (August 2026) are Stead's or Sudermann-Merx's."
  - "No records before Cantrell's 2006 configurations are known: Friedman's earliest archived page (2006-09-04) mentions none."
  - "Ethan Hendren posted AI-assisted computer proofs of optimality for n = 8, 9 and 10 on Zenodo (doi:10.5281/zenodo.24235151, first posted 2026-11-14; doi:10.5281/zenodo.24247460, 2026-11-15; doi:10.5281/zenodo.24426068, 2026-11-23), with exact replay checkers whose traces only the author has run so far, so they aren't recorded. Sudermann-Merx's n = 8 certificate (arXiv:2607.15021) is a floating-point MIP run with a 10^-4 gap, so it isn't recorded either."
  - "Stead's tables go to n = 100; only n <= 36 are tracked here."
