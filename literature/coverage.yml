schur:
  status: complete
  reviewed: 2026-11-19
  sources: [oeis-a045652-schur, schur-1916, abbott-hanson-1972, whitehead-1973, irving-1973-schur, fredricksen-1979, exoo-1994, fredricksen-sweet-2000, heule-2017-schur, ageron-et-al-2021, eliahou-2016-schur, fettes-kramer-radziszowski-2004]
  gaps:
