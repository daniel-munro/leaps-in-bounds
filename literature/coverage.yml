  gaps:
  - "Gardner (Wheels, Life and Other Mathematical Amusements, 1983, ch. 7, p. 61) and MathWorld say a later paper of Lunnon's carried the strip counts to n = 28. It isn't Lunnon 1971 (Computer Journal 14, 75-80), whose Table 1 stops at 12 leaves; Gardner also lists an unpublished 'The Map-Folding Problem Revisited'. If that was ever public, it may be the first source for n = 25 to 28, now credited to Di Francesco, Golinelli and Guitter 1996."
