snake-in-the-box:
  status: complete
  reviewed: 2026-11-23
  sources: [minortriad-snake, uga-sib-records, uga-sib-records-2013, casella-potter-2005a, lukito-2000, bitterman-2004, drapela-2015, meyerson-et-al-2014, allison-paulusma-2016b, taylor-2026]
  gaps:
  - "Many recent lower bounds are preprints or personal communications from Tom Ace's page (#43)."
  - "Potter et al. 1994, Abbott-Katchalski 1991, Rajan-Shende 1999, Kochut 1996, Kinny 2012 (ECAI, and Monte-Carlo search for snakes and coils, MIWAI 2012), Östergård-Pettersson 2014, Hood-Sawada-Wong 2010 and Hood-Recoskie-Sawada-Wong 2015 weren't read (not online, paywalled or behind bot checks), nor Pettersson's thesis (Table 4.1 gives the sources for s(n), n <= 8). Their bounds come from Casella-Potter 2005, Bitterman 2004, Drapela 2015, Meyerson et al. 2014, Allison-Paulusma and the University of Georgia pages."
  - "s(8) >= 89 is credited to Potter et al. 1994, following Bitterman 2004 (and Casella-Potter 2005, who call Potter et al.'s 8-dimensional snake record-breaking); Drapela 2015 credits 89 to Abbott-Katchalski 1991."
  - "s(7) <= 50 is credited to Kochut 1996, following Drapela 2015. Bitterman 2004 and Kunt, Koch and Park (arXiv:2611.25268, 2026) say Potter et al. 1994 already verified the snake of length 50 optimal by exhaustive search, which would date it two years earlier."
  - "The snake lower bounds 168, 338, 618 and 1236 for n = 9 to 12, and 2466 for n = 13, are coils less a vertex, credited as coil-in-the-box credits the coils: 338 to Paterson-Tuliani 1998, and the rest to Abbott-Katchalski 1991, following Lukito's thesis. Casella-Potter 2005 credit 338, 618 and 1236 to Paterson-Tuliani 1998, which would date s(11) >= 618 and s(12) >= 1236 to 1998. 2466 is listed in Meyerson et al. 2014 without a source and credited here to Abbott-Katchalski's coil of 2468."
  - "s(11) >= 695 and s(12) >= 1274 are credited to Kinny's ECAI 2012 paper, as on the University of Georgia page of August 2013; the paper wasn't read, so they may instead come from his MIWAI 2012 paper (December 2012). Meyerson et al. 2014 list s(12) >= 1280 as the record before their work, without a source; it isn't recorded. The University of Georgia page dated July 2014 already shows Meyerson et al.'s 707 for n = 11, before the CIES paper's 705 (December 2014)."
  - "Hood et al.'s s(13) >= 1916 (2010, in Drapela 2015) is below the 2466 implied by Abbott-Katchalski's coil, and Bitterman's s(8) >= 91 below Rajan-Shende's 97, so neither is recorded. W.J. Brown's 2005 University of Georgia thesis and Evdokimov's survey (Uchenye Zapiski Kazan. Univ. 156 (2014) 55-65, with a table of bounds for n = 10 to 12) weren't read."
