minimal-superpermutation:
  status: complete
  reviewed: 2026-11-19
  sources: [engen-vatter-2018, egan-superpermutations, wikipedia-superpermutation, houston-2014, houston-pantone-vatter-2018, superpermutation-almanac]
  gaps:
