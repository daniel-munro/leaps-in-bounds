  - "Bezdek's 1979 dissertation and Nagy's 1975 thesis (both Hungarian, unpublished) and Bezdek 1985 (Ann. Univ. Sci. Budapest) weren't read. Bezdek 1983 refers to the dissertation for the details of r(5), so r(5) and r(6) are both credited to 1979. The n = 6 upper bound of 1974 is Grünbaum's conjectured covering, known only from Bezdek 1983's citation of Shklyarsky, Chentsov and Yaglom (1974), pp. 105-106, which wasn't read. No 1996 publication found for G. Fejes Tóth's proof of n = 8, 9 (published in 2005)."

