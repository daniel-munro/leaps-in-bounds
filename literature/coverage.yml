  - "Upper bounds for n = 11 to 25 from Friedman's page are reciprocals of radii it truncates to three decimals, so they are slightly weak; the precise radii of the same coverings come from the VonEquinox (n = 11 to 20) and Liyang1145 (n = 21 to 24) repositories, which are credited with the precise values."
