kissing-number:
  status: complete
  reviewed: 2026-11-23
  sources: [cohn-kissing-numbers, nebe-sloane-kissing-table, leech-1964, leech-1967, leech-sloane-1970, leech-sloane-1971, odlyzko-sloane-1979, zinoviev-ericson-1999, pfender-2005, bachoc-vallentin-2008, mittelmann-vallentin-2009-v1, mittelmann-vallentin-2009, machado-oliveira-2018, leijenhorst-de-laat-2022, ganzhinov-2022, bianchi-et-al-2026]
  gaps:
  - "Levenshtein 1979, Boyvalenkov 1994 and Vsemirnov-Rzhevskii 2002 weren't read; Boyvalenkov's and Vsemirnov-Rzhevskii's bounds come from Mittelmann-Vallentin (Table 1) and Bachoc-Vallentin (version 4, Table 5.1). Odlyzko-Sloane's 12215 for n = 17 uses extra inequalities (p. 213-214); Pfender's 12218 for the plain Delsarte bound isn't recorded, being weaker."
  - "The Coxeter-Böröczky upper bounds are the values Leech and Sloane (1971, Table I) tabulate as Coxeter's conjectured bound (also listed for n = 4 to 8 by Odlyzko-Sloane, p. 214), dated by Böröczky's 1978 proof; Coxeter 1963 and Böröczky 1978 weren't read."
  - "582 for n = 11 (the packing P11c) is credited to Odlyzko-Sloane 1979 (Table I), the earliest source read that states it. They take their lower bounds from Leech-Sloane 1971 and Sloane's surveys (Binary codes, lattices, and sphere-packings, in Combinatorial Surveys, 1977; Self-dual codes and lattices, Proc. Symp. Pure Math. 34, 1979), which weren't read; the 1977 survey probably has it first. Bianchi et al. (2026, Figure 2) credit 582 to Best 1980 (IEEE Trans. Inform. Theory 26, 738-742), which couldn't be obtained; Zinoviev-Ericson credit it to Conway and Sloane's book."
  - "Leech and Sloane's 1970 note credits Lambda9 (272) to Korkine-Zolotareff 1873 and Lambda10 (336) to Chaundy 1946 (Quart. J. Math. 17, 166-192, received 1945-10-10). Chaundy's Sections 9 and 10 give extreme forms for n = 9 and 10 whose center densities match Lambda9 and Lambda10, but he never counts their minimal vectors, so 272 and 336 aren't stated there; Korkine-Zolotareff 1873 wasn't read. Both stay credited to Leech 1964, where they are stated. Other bounds before Leech 1964 for 9 to 11 and 13 to 15 dimensions weren't looked for; K12 (756) is credited to Coxeter-Todd 1953 and 4320 to Barnes-Wall 1959. Intermediate configurations within one paper (Leech-Sloane's P10a and P11a, K13's 918, the 594 to 603 steps of EinsteinArena) aren't recorded."
  - "Mittelmann-Vallentin's bounds are split by arXiv version: version 1 (2009-02-06, degree 12) and version 2 (2009-05-04, degrees 13 and 14). Bachoc-Vallentin is dated by version 1 (2006-08-16) and Machado-de Oliveira Filho by their 2016 preprint."
  - "Recent bounds from unrefereed preprints: Tomar's upper bounds for n = 5 to 7 and Nyam-Osor's for n = 10, 11 and 16 (Zenodo, 2026), Kravatskiy's GitHub repository (n = 18) and Li's Hexagon preprint (n = 19, 21). Ma et al.'s PackingStar (arXiv:2511.13391) and the 2026 preprints for dimensions 25 and up give no new bounds for n <= 24."

