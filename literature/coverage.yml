# How thoroughly each family's history has been reviewed in the literature.
# See "Coverage" in literature/README.md. Families not listed haven't been reviewed.
#
# status: complete (every improvement in the sources below, up to the review
#   date, is recorded with its original source where it could be found, except
#   the gaps listed) or partial (otherwise; the gaps say what's missing).
# reviewed: when the literature was last searched. A later review only needs
#   what appeared after this date.
# sources: surveys, tables and databases read through for the review, by their
#   IDs in sources.yml.
# gaps: known missing or doubtful parts of the history.
#
# Backfilled on 2026-11-17 from the descriptions of pull requests #16 to #82,
# with every family starting as partial. Families have been marked complete
# since, as their reviews were finished.

ramsey:
  status: complete
  reviewed: 2026-11-23
  sources: [ejc-ds1-small-ramsey-numbers, radziszowski-2025-slides, mckay-radziszowski-1997, kalbfleisch-1965, kalbfleisch-1967]
  gaps:
  - "Table I of all 19 revisions of DS1 compared (#69), and revision 18's Tables Ia, Ib and IIa checked entry by entry for k <= 10, l <= 15. Before DS1 (1994), histories were reconstructed only from McKay-Radziszowski 1997 (R(5,5) and R(4,6)) and Kalbfleisch 1965 and 1967 (R(3,7) to R(3,14), R(4,5), R(5,6), R(6,6)). Other steps before 1994 weren't looked for, such as Graver-Yackel 1968 and Grinstead-Roberts 1982 for R(3,k), and Giraud's 1968 to 1979 upper bounds."
  - "Abbott's 1965 thesis (R(5,5) >= 38), Giraud's 1967 note (R(5,5) <= 58) and Irving's 1973 thesis (R(5,5) >= 42) couldn't be obtained; they are credited through McKay-Radziszowski 1997 (Table I), which gives their full references. Kalbfleisch's 1966 thesis wasn't read: the lower bounds R(3,10) >= 39, R(3,12) >= 49, R(3,14) >= 63 and R(5,6) >= 51 are credited to it through Kalbfleisch 1967, and the R(3,q) upper bounds credited to Kalbfleisch 1967 may appear in it first."
  - "R(4,8) >= 58 is credited to Fujita's arXiv:1212.1328 v2 (2013-03-16), its first public appearance, eight days before Exoo's paper (submitted 2013-02-17) appeared; DS1 credits Exoo."
  - "R(9,14) <= 89203 appears in DS1 revisions 11 to 13 but contradicts later revisions, and was left out (#65)."
  - "Google Research's improved_bounds repository checked commit by commit (#53); no paper found for its October 2026 bounds (Nagda-Raghavan-Thakurta, arXiv:2603.09172, was last revised 2026-04-21)."

book-ramsey:
  status: partial
  reviewed: 2026-11-26
  sources: [ejc-ds1-small-ramsey-numbers, ejc-ds1-r17-small-ramsey-numbers, ejc-ds1-r16-small-ramsey-numbers, ejc-ds1-r13-small-ramsey-numbers, ejc-ds1-r11-small-ramsey-numbers, ejc-ds1-r1-small-ramsey-numbers, lidicky-mckinley-pfender-2024, lidicky-mckinley-pfender-van-overberghe-2024, wesley-2024, nikiforov-rousseau-2004, black-leven-radziszowski-2011, van-overberghe-2024]
  gaps:
  - "Table IXa of revision #18 checked cell by cell, with the book sections of revisions #1, #11, #12, #13, #15, #16 and #17 to date the steps, and Van Overberghe's circulant-Ramsey commits of 2024-07-15 and 2024-09-30. The 14 cells left blank in the table (R(B3, Bn) for n = 8 to 11, R(B4, Bn) and R(B5, Bn) for n = 8, 10, 11, R(B6, Bn) for n = 9 to 11, and R(B8, B11)) have no rows, though 5.3(k) gives an upper bound of 2(m + n + 1) for each of them."
  - "Not read, and credited through the survey: Rousseau and Sheehan 1978 (most rows), Chvátal and Harary 1972 part II, Clancy 1977, Faudree, Rousseau and Sheehan 1982, Shao, Xu, Bao and Pan 2010, and Wesley's 2023 thesis (bot checks, paywalls or refused downloads; requested in sources-inbox). Rousseau and Sheehan's general upper bounds are applied to each pair as the survey states them, so its rows for pairs the paper doesn't list are corollaries; R(B2, Bn) <= 2n + 6 is credited to Faudree, Rousseau and Sheehan 1982 by some later papers."
  - "The lower bounds R(B4, B9) >= 27 and R(B7, B11) >= 37, from the (26, 10, 3, 4) and (36, 15, 6, 6) strongly regular graphs (survey item 5.3(l)), have no source: they first appear in revision #16's table. R(B7, B10) >= 36 is credited to Nikiforov and Rousseau 2004 but may be in Rousseau and Sheehan 1978 or Faudree, Rousseau and Sheehan 1982."
  - "R(B5, B9): HITESH4577's README says the lower bound 29 was first reported by Quantavane (https://quantavane.com/results/), which couldn't be fetched (SSL error), so it isn't credited. The survey's R(B5, B9) >= 28 is credited to Van Overberghe through revision #18; no construction for it was found."
  - "Rousseau's 2006 personal communication: Black, Leven and Radziszowski say it gave 17 <= R(B2, B6) <= 18, while the survey says it gave R(B2, B6) = 17; only the lower bound is credited to it."
  - "Earlier lower bounds not recorded since later sources reached the same values first or they are implied only by monotonicity: Ghebleh et al. 2024 (R(B3, B6) >= 17, R(B4, B5) >= 18), and the matching lower bounds of Lidický, McKinley and Pfender and of Wesley after Van Overberghe's."

square-packing:
  status: complete
  reviewed: 2026-11-24
  sources: [ejc-ds7-packing-unit-squares, ejc-ds7-2000, ellsworth-squares-in-squares, ellsworth-squares-in-squares-compared, wikipedia-square-packing, squaremath-frontier, nagamochi-2005, karakus-2026, basic-slivkova-2018]
  gaps:
  - "The Squares Project's case histories (its results register, packing/frontier/results.yaml, and case records, as of 2026-11-23) are recorded for every n <= 100, read through the project rather than each source directly and dated by each source's release. Deliberately left out: steps superseded on the same day, since the build can't order them (such as Ryu's s(12) >= 31360/7901, Guzhou0806's R067 for s(17), the project's own intermediate rungs, and its 3.8269975 for s(11)); bounds that the project derives from another n by monotonicity rather than from a certificate's own mass; steps too small to show at seven significant digits (Wang and Li's s(11) > 3.875000004, Guzhou0806's R070 for s(17)); exact certifications or rational refinements of known packings that lower a side by less than 1e-9; and unnir's s(12) >= 9929/2500 (2026-11-08), which came after the reported proof that s(12) = 4. Guzhou0806's R038 for s(17) (about 2026-09-21, 4.6141535) is left out since its date is unclear and it was passed by 2026-09-21. The project's n = 17 history begins with Brandwijk's capsule of 2026-07-18; Mira's, Fort's and MacIver's August certificates are below Burns's 4.4811 and aren't improvements."
  - "Several recorded bounds are reported by their sources but not replayed by the Squares Project: Hosono's fine-net and continuous-pose bounds of 2026-10-13 to 2026-10-16 (s(28), s(38), s(40), s(41), s(43), s(44), s(51), s(86), s(88) to s(92)), anabologyco-maker's s(17) >= 4.5705, and the Lean proofs of s(12) = 4 (Jatloe, Gurevitch, CTJLewis and Ahmed, 2026-10-16), s(17) = Bidwell's side (Fitzharding, 2026-10-12) and s(19) = 3 + 4√2/3 (Fitzharding, 2026-10-16), which the project audited but hasn't rebuilt. Wikipedia still calls n = 12 unresolved. Overbeck's candidate proof that s(17) equals Bidwell's packing (2026-10-12) isn't recorded, since its author calls it a candidate."
  - "Nagamochi 2005's proof is incomplete (Karakuş, arXiv:2609.37410; chelokot, 2026-09-05). Its rows for s(n²-1) = s(n²-2) = n are kept as the published claims, with a note on the source, since both have been proved again (Karakuş; in Lean by chelokot). Theorem 2's general lower bound s(N) >= 1 + √(N - 2⌊√N⌋ + 1), which would give earlier steps for 43 values of n (such as √15 + 1 for n = 22, cited by Bentz 2016), isn't recorded, since only Karakuş's weaker version is proved; that version is recorded where it improved the history (n = 87, 92, 93, 96, 97). Hosono's closed form of 2026-10-13 improves nothing for n <= 100."
  - "Ellsworth's pages date steps only to the month, so steps they list within the same month as a larger improvement aren't recorded separately, such as Schadt's 6.93669 for s(41) and Ellsworth's 7.954167 for s(55)."
  - "The Squares Project dates Khalili and Gharabaghi's s(44) cover 2026-10-26, but its packet and the source's ID here use 2026-10-29, the date kept."

busy-beaver-shift:
  status: complete
  reviewed: 2026-11-19
  sources: [michel-busy-beaver, oeis-A060843, aaronson-2020, rado-1962, lin-1963, lin-1965, brady-1964, lynn-1972, weimann-1973, ludewig-schult-wankmuller-1983, brady-1983, brady-1988, marxen-1990, ligocki-2022-05-13]
  gaps:
  - "Brady's 107 for k = 4 is credited to his October 1966 paper, which wasn't read; his abstract in Notices of the AMS (June 1965) may state it first, and wasn't found."
  - "S(4) <= 107 is credited to Brady 1983. Weimann, Casper and Fenzl (GI conference, October 1972; LNEMS 78, 1973) and Weimann's 1973 dissertation claimed it earlier with partly hand-checked computer searches, and Brady announced his proof in a 1974 report and 1975 abstracts, which weren't read."
  - "Lynn's 1974 machine with S(5) >= 7707 and Brady's 6-state S(6) >= 13488 were first published in Brady 1983, after Schult's machines from the January 1983 Dortmund competition, so they aren't recorded."
  - "Green 1964 wasn't read, and no step count from it is recorded; the bbchallenge wiki computes S >= 197,700,005 for Green's 7-state machine. Seven-state bounds implied by 6-state records, such as those from 1990 to 2022 listed on the wiki, aren't recorded."
  - "The 2010 Kropitz machines are dated from Michel's survey and Kropitz's 2011 thesis; Marxen's pages, which may have posted the June 2010 machine first, weren't checked. The Wythagoras 2014 page on the Googology Wiki was blocked (HTTP 402); its value comes from Aaronson 2020 and Michel."
  - "The October 2026 7-state machine claimed by J. Ketchersid (S(7) > 3↑²⁰3), listed on the bbchallenge wiki's Busy Beaver Champions page as never verified, isn't recorded. The May 2025 7-state records are dated from Discord message timestamps cited by the bbchallenge wiki."

