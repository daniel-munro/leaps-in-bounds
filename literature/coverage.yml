  - "Fredricksen 1979 says S(5) >= 157 improves earlier lower bounds, citing his 'Five sum-free sets' (Proc. 6th Southeastern Conf., 1975, 309-314), which wasn't found; an S(5) bound between 121 and 157 may be missing."
  - "Wan 1997 was read only through its zbMATH summary; its S(6..9) bounds are evaluated from the stated formulas, and the summary leaves unclear whether S_n is the largest n or one more."
  - "Schur's footnote (p. 117) claims without proof that S(4) > 40; it isn't recorded. Baumert's 1961 computation of S(4) = 44 is unpublished (Abbott and Hanson 1972), so the bound is dated by Golomb and Baumert 1965, which was read only through later citations."
  - "Upper bounds on S(k) from bounds on R_k(3) by S(k) <= R_k(3) - 2 are recorded only where a source states the Ramsey bound or the Schur bound; S(6) <= 1896 from R_6(3) <= 1898, for example, isn't recorded."

