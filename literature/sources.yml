  notes: "Superpermutations of length 5908 = L(7) - 5 for n = 7 and 46205 = L(8) - 28 for n = 8 (message of 11:12 UTC, correcting a first post of 5909 and 46206 earlier the same day), from an adaptation of Aaron Williams's Hamilton cycles. Later that day the general length n! + (n-1)! + (n-2)! + (n-3)! + n - 3 is proposed."
