csordas-o-s-v-1993:
  string: "Csordas, G., Odlyzko, A. M., Smith, W., & Varga, R. S. (1993). A new Lehmer pair of zeros and a new lower bound for the de Bruijn-Newman constant Λ. Electronic Transactions on Numerical Analysis, 1, 104-111."
  date: "1993-12"
