oler-groemer-1961:
  string: "Groemer, H. (1960). Über die Einlagerung von Kreisen in einen konvexen Bereich. Math. Z., 73, 285-294; Oler, N. (1961). A finite packing problem. Canad. Math. Bull., 4, 153-155."
  date: "1961-05"
  doi: "https://doi.org/10.4153/CMB-1961-018-7"
  notes: "Oler's inequality: a compact convex set X holds at most (2/sqrt(3)) A(X) + P(X)/2 + 1 points at mutual distance at least 1. Applied to the centers of n unit circles in a square of side s, which lie in a square of side s - 2 at mutual distance at least 2, it gives n <= (2/sqrt(3)) t^2 + 2t + 1 for t = (s - 2)/2, so s(34) >= 11.0991 and s(35) >= 11.2579 (not stated as such)."
  added_by: daniel-munro

