  notes: "Section 3.1 (pp. 8-12): Moore graphs, the Moore bound and their nonexistence (Hoffman-Singleton 1960, Bosák 1970, Friedman 1971, Damerell 1973, Bannai-Ito 1973). Section 3.2 (pp. 12-16): graphs of defect 1 and 2 (Erdős-Fajtlowicz-Hoffman 1980, Bannai-Ito 1981 and Kurosawa-Tsujii 1981 giving n(d,k) <= M(d,k) - 2 for d >= 3; Jørgensen 1992; Conde-Gimbert 2009; Feria-Purón-Miller-Pineda-Villavicencio 2011; Miller-Pineda-Villavicencio 2009)."
  added_by: daniel-munro

bosak-1970:
  string: "J. Bosák, Cubic Moore graphs, Matematický časopis 20 (1970) 72-80."
  date: "1970"
  url: "https://dml.cz/dmlcz/126958"
  notes: "Theorem (p. 79): there is no Moore graph of type (3,k) for 3 <= k <= 8, so n(3,k) <= M(3,k) - 1 for these k (a graph attaining the Moore bound is regular, Hoffman-Singleton 1960, Section 2). Received 1968-07-04; a footnote on p. 72 says the result was presented at the Colloquium on Graph Theory in Manebach in May 1967."
  added_by: daniel-munro

erdos-fajtlowicz-hoffman-1980:
  string: "P. Erdős, S. Fajtlowicz and A. J. Hoffman, Maximum degree in graphs of diameter 2, Networks 10 (1980) 87-90."
  date: "1980-03"
  doi: "https://doi.org/10.1002/net.3230100109"
  notes: "Abstract: with the exception of C_4 there are no graphs of diameter 2, maximum degree d and d^2 vertices, so n(d,2) <= d^2 - 1 = M(d,2) - 2 for d >= 3 with d not 3, 7 or 57 (no Moore graph, Hoffman-Singleton 1960). Only the abstract was read."
  added_by: daniel-munro

jorgensen-1992:
  string: "L. K. Jørgensen, Diameters of cubic graphs, Discrete Applied Mathematics 37/38 (1992) 347-351."
  date: "1992-07"
  doi: "https://doi.org/10.1016/0166-218X(92)90144-Y"
  notes: "Not read directly. Shows that a graph of maximum degree 3 and diameter k >= 4 cannot have defect 2 (zbMATH review 0768.05035; Miller-Širáň survey, p. 13). Miller (An overview of the degree/diameter problem for directed, undirected and mixed graphs, IWONT 2010 invited talk, p. 4) states the consequence n(3,k) <= M(3,k) - 4 for k >= 4: defect 1 is excluded by Bannai-Ito and Kurosawa-Tsujii (1981), and an odd defect is impossible by the handshaking lemma, since a graph of maximum degree 3 and defect 3 must be cubic (Feria-Purón et al. 2011, Proposition 4.1)."
  added_by: daniel-munro

conde-gimbert-2008:
  string: "J. Conde and J. Gimbert, On the existence of graphs of diameter two and defect two, Discrete Mathematics 309 (2009) 3166-3172."
  date: "2008-10"
  doi: "https://doi.org/10.1016/j.disc.2008.09.017"
  notes: "Not read directly. Shows there are no graphs of maximum degree d, diameter 2 and order d^2 - 1 (defect 2) for 5 < d < 50 (Miller-Širáň survey, p. 13; zbMATH review 1189.05053: verified for d = 6, ..., 50 using PARI), so n(d,2) <= M(d,2) - 3 for these d. Dated by its online appearance (Crossref record created 2008-10-15); print issue May 2009."
  added_by: daniel-munro

miller-nguyen-pineda-2009:
  string: "M. Miller, M. H. Nguyen and G. Pineda-Villavicencio, On the nonexistence of graphs of diameter 2 and defect 2, Journal of Combinatorial Mathematics and Combinatorial Computing 71 (2009) 5-20."
  date: "2009"
  url: "https://guillermo.com.au/pdfs/BothDegrees.pdf"
  notes: "Read in the authors' version at the URL. Theorem 6: no (d,2,-2)-graph for odd d >= 7 with d not of the form l^2+l+3 or l^2+l-1; Theorem 7: none for odd d >= 7 when (d^2-1)(d^3-2d^2+3d-8)/10 is not an integer. The text after Theorem 7 states n(d,2) <= d^2 - 3 = M(d,2) - 4 for every odd d so ruled out (d = 13, 15, 17 in the range 8-20; defect 3 is impossible for odd d since such a graph is regular of odd order). The same claim of d^2 - 3 after Theorems 3-4 for even d seems to need more than is proved (only defect 2 is ruled out), so only odd d are used. Earlier conference versions: IWOCA 2007 (odd degree) and CATS 2008 (even degree), not read."
  added_by: daniel-munro

miller-pineda-2009:
  string: "M. Miller and G. Pineda-Villavicencio, Complete catalogue of graphs of maximum degree 3 and defect at most 4, Discrete Applied Mathematics 157 (2009) 2983-2996."
  date: "2009-05"
  doi: "https://doi.org/10.1016/j.dam.2009.04.021"
  notes: "Not read directly. Completes the catalogue of graphs of maximum degree 3 and defect at most 4 (Miller-Širáň survey, p. 16); Miller (IWONT 2010 invited talk, p. 4) states the consequence n(3,k) <= M(3,k) - 6 for k >= 5, attributing it to 2008. Dated by its online appearance (Crossref record created 2009-05-16)."
  added_by: daniel-munro

feria-puron-miller-pineda-2010:
  string: "R. Feria-Purón, M. Miller and G. Pineda-Villavicencio, On graphs of defect at most 2, Discrete Applied Mathematics 159 (2011) 1331-1344, arXiv:1010.5658."
  date: "2010-10-27"
  url: "https://arxiv.org/abs/1010.5658"
  doi: "https://doi.org/10.1016/j.dam.2011.04.018"
  notes: "Section 7.1 (arXiv v1 and v2): Proposition 7.1, N(d,k) <= M(d,k) - 3 for even d >= 4 and k >= 4, and N(4,k) <= M(4,k) - 3 for k >= 3 (using Theorem 6.1, no (4,3,-2)-graph); Proposition 7.2, N(d,k) <= M(d,k) - 4 for odd d >= 5 and k >= 4 when M(d,k) - 2 is not divisible by k (Theorem 5.3; Corollary 7.1 is the case d = 0, 2 mod k). Section 1 notes that the earlier claimed proof of the case d = 4 by Miller and Simanjuntak (Discrete Math. 308 (2008)) contained a mistake."
  added_by: daniel-munro

