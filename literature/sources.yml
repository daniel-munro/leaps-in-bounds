goldberg-1972:
  string: "M. Goldberg, Maximizing the smallest triangle made by N points in a square, Mathematics Magazine 45(3) (1972) 135-144."
  date: "1972-05"
  doi: "https://doi.org/10.1080/0025570X.1972.11976214"
  notes: "The table of areas in Section 10 gives the best arrangements found for n = 3 to 16: 1/2, 1/2, (3 - √5)/4, 1/8, 0.079, (2 - √3)/4, 1/21, (3√17 - 11)/32, 1/27, 1/33, 0.022 (n = 13), 0.020 (n = 14), and 0.0175 (n = 16), with n = 15 left blank. Section 8 says no arrangement of 15 points was found better than deleting a point from the 16-point one, which gives 0.0175 for n = 15 too. Section 3 notes that 1/2 is best for n = 3 and 4, since a triangle in a square has at most half its area. Section 2 gives the upper bound M(n) <= 1/(n - 1) for n > 8: some point is inside the square, and the lines from it through the other points cut the square into n - 1 regions. Goldberg says this was obtained as a solution of Kung's Problem 745, which he also solved; the printed solution (Schwartz) gives it only for odd n, so the even n are cited here."
  added_by: daniel-munro

