  notes: "Received 1993-02-18. Section 2 gives f(4) >= 20, f(5) >= 42, f(6) >= 112 and f(7) >= 236, where f(n) is the largest cap in AG(n,3), saying the best earlier lower bounds for n = 5 and 7 were 40 and 224, although brown-buhler-1982 had already given 45 for n = 5. The two 112-caps (Figure 3) are 'essentially due to Hill' (hill-1973), and the 236-cap is built from them."
  added_by: daniel-munro

