robinson-1961:
  string: "R.M. Robinson, Arrangement of 24 points on a sphere, Mathematische Annalen 144 (1961) 17-48."
  date: "1961"
  doi: "https://doi.org/10.1007/BF01396539"
  url: "https://gdz.sub.uni-goettingen.de/id/PPN235181684_0144"
  notes: "Read directly (Sections 1 and 9-10). Received 19 November 1960; the result for N = 24 was announced in 1959 (robinson-1959). Theorem Ba strengthens Fejes Tóth's bound for all n > 12: 4nΔ + (2n - 12)Δ* ≤ 12π, where Δ is the area of an equilateral spherical triangle of side a with angle α, and Δ* that of an isosceles triangle with two sides a enclosing the angle 2π - 4α. Section 9.5 improves it for n > 24 to 4nΔ + (2n - 24)Δ* + 12Δ' < 12π, where Δ' = 2β - π for the angle β of a spherical square of side a. The paper doesn't evaluate these for particular n: the upper bounds for n = 14-23 (Theorem Ba) and n = 25-30 (Section 9.5) are computed here, rounded up. Musin (arXiv:1604.02776, Section 1.1) also states that Robinson's bound holds for all N."
