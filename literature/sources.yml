  date: "1970"
  url: "https://zbmath.org/0223.50020"
  notes: "Not read directly. The volume is dated 1970 but was printed in 1971 (Hill 1973; Davis and Maclagan 2003). Proves that the largest cap in PG(4,3), and so in AG(4,3), has 20 points (bierbrauer-2003, Section 10; edel-et-al-2007, Section 5)."
  added_by: daniel-munro

hill-1973:
  string: "R. Hill, On the largest size of cap in S_{5,3}, Atti della Accademia Nazionale dei Lincei. Rendiconti. Classe di Scienze Fisiche, Matematiche e Naturali 54 (1973) 378-384."
  date: "1973-03"
  url: "http://www.bdim.eu/item?id=RLINA_1973_8_54_3_378_0"
  notes: "Presented 1973-03-10. Constructs the 56-cap in PG(5,3) and proves it is the largest. The affine 45-cap is implicit: the blocks of the (56,11,2) design in Section 2(5) are the 11-point sections of the cap by the polar hyperplanes of its points, and deleting one leaves a 45-cap in AG(5,3) (edel-ferret-landjev-storme-2002, Remark 4.1). Hill's Caps and codes (Discrete Math. 22, 1978) is likewise implicit, through codewords of weight 45. The first explicit statement found is brown-buhler-1982. The paper doesn't mention AG(6,3)."
  added_by: daniel-munro

