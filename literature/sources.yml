nagamochi-2005:
  string: "Nagamochi, H. (2005). Packing unit squares in a rectangle. The Electronic Journal of Combinatorics, 12, R37."
  date: "2005-07-30"
  doi: "https://doi.org/10.37236/1934"
  notes: "Theorem 1 claims that fewer than ab - (a+1-⌈a⌉) - (b+1-⌈b⌉) unit squares fit in any rectangle smaller than a × b, and Theorem 2 deduces s(n²-1) = s(n²-2) = n, and s(N) >= 1 + √(N - 2⌊√N⌋ + 1) for other N >= 4. The proof is incomplete: the per-square scoring assertion (Lemma 1), from which Theorem 1 is summed, fails for squares near a corner of the container, because Case 6 of Section 5.5 applies Lemma 6 without its hypothesis on which edge holds (2, 0.9). chelokot's square-packing-archive found counterexamples on 2026-09-05, and Karakuş (arXiv:2609.37410, 2026-09-29) published them; neither disproves the bounds. s(n²-1) = n was proved again by Karakuş (Corollary 1.2) and in Lean by chelokot, and s(n²-2) = n in Lean by chelokot (2026-09-05), whose proof the Squares Project replayed. Theorem 2's general bound has no complete proof; Karakuş proves only the weaker s(N) >= 1/2 + √(N - ⌊√N⌋ + 1/4) for nonsquare N >= 8. Bentz 2010 and 2016 use Nagamochi's Lemmas 7(ii) and 2, which don't depend on Lemma 1."
  added_by: daniel-munro

