  notes: "Appendix E (Table 15) is a timeline of snake lower bounds for n <= 14 with sources, and Appendices A to D cover coils. It credits s(7) = 50 to Kochut (1996), proving Potter et al.'s (1994) snake optimal, and s(8) >= 89 to Abbott and Katchalski (1991)."
