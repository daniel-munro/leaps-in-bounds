  date: "1993"
  url: "https://zbmath.org/?q=an:0801.05004"
  notes: "Not read directly: Congressus Numerantium isn't online and zbMATH refused automated access. Engen and Vatter (engen-vatter-2018), Section 2, report its recursive construction (Theorem 3 and Lemma 5), which gives superpermutations of length 1! + 2! + ... + n! for every n (their Proposition 2.2), and its lower bound n! + (n-1)! + n - 2 (proof of Theorem 18; their Proposition 2.4). Houston (2014), Section 1, also says Ashlock and Tillotson established that 1! + ... + n! symbols suffice and conjectured that this is optimal."
  added_by: daniel-munro

anonymous-2011:
  string: "Anonymous, Permutations Thread III, 4chan /sci/ (2011-09-17), archived at warosu.org."
  date: "2011-09-17"
  url: "https://warosu.org/sci/thread/S3751105#p3751197"
  notes: "Post 3751197 announces a proof of the lower bound n! + (n-1)! + (n-2)! + n - 3 for n >= 2, and post 3751207 gives it. The archive timestamps them 2011-09-17 02:35 and 02:38. Quanta (2018-11-05) dates the post September 16, presumably in US time. Engen and Vatter (engen-vatter-2018, Theorem 2.5) credit the bound to this anonymous poster, and Houston, Pantone and Vatter (houston-pantone-vatter-2018) wrote up the proof."
  added_by: daniel-munro

engen-vatter-2018:
  string: "M. Engen and V. Vatter, Containing all permutations, American Mathematical Monthly 128 (2021) 4-24, arXiv:1810.08252."
  date: "2018-10-18"
  url: "https://arxiv.org/abs/1810.08252"
  doi: "https://doi.org/10.1080/00029890.2021.1835384"
  notes: "Survey, read in arXiv v4 (2020-03-28). Section 2 covers the history up to 2019: Ashlock and Tillotson's construction and lower bound (Propositions 2.2 and 2.4), Chaffin's n = 5, Houston's 872, Egan's construction (Theorem 2.3), the 4chan bound (Theorem 2.5) and Houston's improvement of it by 1, Coanda's 5907, and Egan and Houston's 5906."
  added_by: daniel-munro

houston-2018:
  string: "R. Houston, Improving the lower bound, Superpermutators Google Group (2018-11-02)."
  date: "2018-11-02"
  url: "https://groups.google.com/g/superpermutators/c/MFtWmIDgvPM"
  notes: "Houston's second attempt (2018-11-02) argues that a walk meeting the 4chan bound would be a single 3-cycle, which is impossible for n > 4. In terms of the walk's weight, this raises the bound from n! + (n-1)! + (n-2)! - 3 to n! + (n-1)! + (n-2)! - 2, so the length is at least n! + (n-1)! + (n-2)! + n - 2. A first attempt on 2018-11-01 was withdrawn. Greg Egan replied 'This all looks correct to me!' (2018-11-03). Engen and Vatter (after Theorem 2.5) report the improvement by 1."
  added_by: daniel-munro

egan-2018:
