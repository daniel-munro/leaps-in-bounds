  string: "F.A. Rafilipojaona, Nombres de Schur classiques et faibles, Ph.D. thesis, Université du Littoral Côte d'Opale, 2015, HAL tel-01344633."
  date: "2016-07-13"
  url: "https://theses.hal.science/tel-01344633"
  notes: "Defended 2015-07-10; the manuscript was released on HAL on 2016-07-13, the date used here. Its Propositions 68-70 give WS(7) >= 1740, WS(8) >= 5201 and WS(9) >= 15596, later published as rafilipojaona-2017 (received by Integers 2015-04-20). Neither cites Bouzy's report of 2015-09-17 (WS(7) >= 1736, WS(8) >= 5105), found independently. If the defense date is taken as the public date instead, Bouzy's two bounds were not improvements."
  added_by: daniel-munro

ringel-1956:
  string: "G. Ringel, Teilungen der Ebene durch Geraden oder topologische Geraden, Mathematische Zeitschrift 64 (1956) 79-102."
  date: "1956"
  doi: "https://doi.org/10.1007/BF01166556"
  notes: "Counts the simple arrangements of up to 7 lines in the affine plane (p. 80)."
  added_by: daniel-munro

finschi-2001:
  string: "L. Finschi, A Graph Theoretical Approach for Reconstruction and Generation of Oriented Matroids, Dissertation, ETH Zürich, 2001."
  date: "2001"
  doi: "https://doi.org/10.3929/ethz-a-004255224"
  notes: "Table 8.1 (p. 165) counts abstract dissection types of n lines in the plane, not all parallel: 46, 790, 37829 and 4134939 for 5 to 8 lines. Adding 1 for all lines parallel gives A241600. Every arrangement of at most 8 pseudolines is stretchable (Goodman and Pollack), so these are all realizable for up to 7 affine lines (8 projective lines with the line at infinity). For 8 affine lines some abstract types aren't realizable, so 4134940 is only an upper bound on the number of combinatorial types."
  added_by: daniel-munro

forcey-2025:
