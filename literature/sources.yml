kalbfleisch-1967:
  string: "J.G. Kalbfleisch, Upper Bounds for Some Ramsey Numbers, Journal of Combinatorial Theory, 2 (1967) 35-42."
  date: "1967"
  doi: "https://doi.org/10.1016/S0021-9800(67)80112-1"
  notes: "Table 2 gives new upper bounds M(3,q) <= 24, 30, 37, 45, 54, 63, 73 and 84 for q = 7 to 14 (M(p,q) is R(p,q)), proved for q = 7 and 8 (Theorems 1 and 4), with details in Kalbfleisch's 1966 thesis (Chapter 5). Section 3 shows there is no (4,5)-colouring of K_30 and no (4,6)-colouring of K_46, so R(4,5) <= 30 and R(4,6) <= 46, and notes that Lemma 2 then gives R(5,5) <= 59 and R(4,6) <= 47. Kalbfleisch 1965 (Table 2) had already announced R(3,7) <= 24, R(4,5) <= 30, R(4,6) <= 47 and R(5,5) <= 59, so they are credited there; the other R(3,q) bounds may be in the 1966 thesis, which wasn't read. Table 3 also lists R(5,6) <= 105 and R(6,6) <= 210 from Lemma 2 (Erdős-Szekeres). The lower bounds in Tables 2 and 3 not in Kalbfleisch 1965 (R(3,10) >= 39, R(3,12) >= 49, R(3,14) >= 63, R(5,6) >= 51) are attributed to the 1966 thesis. Cites Abbott's thesis as April 1965 for R(5,5) >= 38."
  added_by: daniel-munro

