  date: "1994-09-18"
  doi: "https://doi.org/10.37236/1188"
  notes: "Submitted 1994-09-13, accepted 1994-09-18. Gives a partition of [1, 160] into 5 sum-free sets, so S(5) >= 160 and R_5(3) >= 162, and R_6(3) >= 500 from Chung's recurrence. Says the best previously published bounds were 157 <= S(5) <= 321 (Fredricksen 1979, Whitehead 1973). S(6) >= 481 = 3 * 160 + 1 follows by Schur's recurrence, as https://doi.org/10.37236/1510 notes."
  added_by: daniel-munro

