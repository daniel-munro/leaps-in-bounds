stead-heilbronn-triangle:
  string: "T. Stead, The Heilbronn problem: triangle, tables of the best known configurations of n points in a triangle of unit area for n = 3 to 100, with their record histories (linked from Erich Friedman's Packing Center), retrieved 2026-11-23."
