ringel-1956:
  string: "G. Ringel, Teilungen der Ebene durch Geraden oder topologische Geraden, Mathematische Zeitschrift 64 (1956) 79-102."
  date: "1956"
  doi: "https://doi.org/10.1007/BF01166556"
  url: "https://gdz.sub.uni-goettingen.de/id/PPN266833020_0064"
  notes: "Quotes on p. 80 Klee's 1938 counts of simple arrangements of up to 7 lines in the affine plane, 1, 1, 1, 1, 6, 43, 922 (see klee-1938), and doesn't compute them itself. Received 1955-04-16. Open scan on GDZ."
  added_by: daniel-munro

klee-1938:
  string: "R. Klee, Über die einfachen Konfigurationen der euklidischen und projektiven Ebene, Dissertation, Dresden: Focken und Oltmanns, 1938."
  date: "1938"
  url: "https://zbmath.org/?q=an:0019.13501"
  notes: "Not read. Ringel 1956 (p. 80) quotes Klee's counts A_1 = ... = A_4 = 1, A_5 = 6, A_6 = 43, A_7 = 922 of simple arrangements of up to 7 lines in the plane, mirror images identified, and the zbMATH review (Zbl 0019.13501) gives 6, 43 and 922 too, with 7, 79 and 1765 counting mirror images apart. Klee counted pseudoline configurations and claimed they are all stretchable, which the reviewer found unconvincing; for up to 7 affine lines they are (Goodman and Pollack 1980)."
  added_by: daniel-munro

finschi-2001:
  string: "L. Finschi, A Graph Theoretical Approach for Reconstruction and Generation of Oriented Matroids, Dissertation, ETH Zürich, 2001."
  date: "2001"
  doi: "https://doi.org/10.3929/ethz-a-004255224"
  url: "https://www.finschi.com/math/publ/2001-08-31_Finschi_A-Graph-Theoretical-Approach-for-Reconstruction-and-Generation-of-Oriented-Matroids.pdf"
  notes: "Table 8.1 (p. 165) counts abstract dissection types of n lines in the plane, not all parallel: 1, 3, 8, 46, 790, 37829 and 4134939 for 2 to 8 lines. Adding 1 for all lines parallel (the d = 1 row) gives A241600 for 1 to 7 lines. Every arrangement of at most 8 pseudolines is stretchable (Goodman and Pollack), so these are all realizable for up to 7 affine lines (8 projective lines with the line at infinity). For 8 affine lines some abstract types aren't realizable, so 4134940 is only an upper bound on the number of combinatorial types. Table 8.2 counts the non-degenerate types, 38612 for 8 lines, which bounds the arrangements of 8 lines in general position. Table 6.3 (p. 141) gives 95052532 isomorphism classes of simple rank-3 oriented matroids on 10 elements, so there are at most 10 * 95052532 + 1 = 950525321 combinatorial types of 9 lines (see finschi-catalog; not stated as such)."
  added_by: daniel-munro

forcey-2025:
  string: "S. Forcey, Counting plane arrangements via oriented matroids, arXiv:2504.11461, 2025."
  date: "2025-03-31"
  url: "https://arxiv.org/abs/2504.11461"
  notes: "Open Problem 14 (p. 18) gives 4134940 for 8 lines, from Finschi's table, which counts abstract types including non-stretchable ones."
  added_by: daniel-munro

christ-2011:
  string: "T. Christ, Discrete Descriptions of Geometric Objects, Dissertation, ETH Zürich, 2011, with the Database of Combinatorially Different Simple Line Arrangements."
  date: "2011"
  doi: "https://doi.org/10.3929/ethz-a-007018092"
  notes: "The database (https://geometry.inf.ethz.ch/christt/linearr/) lists all simple arrangements of up to 9 lines; OEIS A090338 takes a(9) from it."
  added_by: daniel-munro

knuth-1992:
  string: "D.E. Knuth, Axioms and Hulls, Lecture Notes in Computer Science 606, Springer, 1992."
  date: "1992"
  doi: "https://doi.org/10.1007/3-540-55611-7"
  notes: "Section 9 tabulates E_n, the simple arrangements of n pseudolines in the projective plane (A006248), up to E_9 = 4382, and the historical notes add Laffaille's E_10 = 312356 and Bokowski and Richter-Gebert's count of 242 non-realizable classes on 10 points. So at most 9 * 4382 = 39438 arrangements of 8 lines in general position, and 10 * (312356 - 242) = 3121140 of 9 lines (see oeis-a006248-pseudolines; not stated as such). Read from the TeX source."
  added_by: daniel-munro

wild-reeves-2004:
  string: "J. Wild and L. Reeves, a(8) = 38609 of OEIS A090338, the arrangements of 8 lines in general position in the plane (2004)."
  date: "2004-01-27"
  url: "https://oeis.org/A090338"
  notes: "In the original submission of A090338 (author line dated 2004-01-27, published 2004-02-19), with A090339(8) = 38612 for pseudolines, the difference being 3 non-stretchable configurations."
  added_by: daniel-munro

felsner-1996:
  string: "S. Felsner, On the number of arrangements of pseudolines, Proc. 12th Annual Symposium on Computational Geometry (1996); Discrete Comput. Geom. 18 (1997) 257-267."
  date: "1996"
  url: "http://page.math.tu-berlin.de/~felsner/Paper/numarr.pdf"
  doi: "https://doi.org/10.1007/PL00009318"
  notes: "Computes B_10 = 18,410,581,880 (p. 9, Enumeration), the number of simple arrangements of 10 pseudolines with a marked unbounded cell (A006245(10)), which bounds the arrangements of 10 lines in general position (see oeis-a006245-sorting-networks)."
  added_by: daniel-munro

yamanaka-2009:
