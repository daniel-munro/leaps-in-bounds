kung-1970:
  string: "S.H.L. Kung, Problem 745 (A nine point problem), Mathematics Magazine 42 (1969), solution by B.L. Schwartz, Mathematics Magazine 43(3) (1970) 170-171."
  date: "1970-05"
  url: "https://www.jstor.org/stable/2688403"
  notes: "Proposed in November 1969: among nine points in a unit square, some three form a triangle of area at most 1/8. Schwartz's solution: three points in a rectangle span at most half its area, and a quadrant contains three of the points; more generally, among 2pq + 1 points some three span at most 1/(2pq), from a p × q grid of rectangles. Goldberg 1972 (Section 2) states the bound H(n) <= 1/(n - 1) for n > 8 as obtained from this problem (an interior point, and the lines from it through the other points), but the solution printed here doesn't give it: it gives H(2pq + 1) <= 1/(2pq), so H(n) <= 1/(n - 1) only for odd n, where n - 1 = 2pq with p = 1. The even-n bounds are cited to Goldberg."
  added_by: daniel-munro

