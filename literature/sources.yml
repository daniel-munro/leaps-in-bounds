# Rectilinear crossing number

guy-1972:
  string: "R.K. Guy, Crossing numbers of graphs, in Graph Theory and Applications (Proc. Conf., Western Michigan Univ., 1972), Lecture Notes in Math. 303, Springer, Berlin, 1972, pp. 111-124."
  date: "1972"
  doi: "https://doi.org/10.1007/BFb0067363"
  notes: "Pages 117-120 prove that the (ordinary) crossing number of K_9 is 36, and say that its drawings for n <= 7 and n = 9 can be made rectilinear, so the rectilinear values are 1, 3, 9 and 36 for n = 5, 6, 7 and 9. They also prove the rectilinear crossing number of K_8 is 19 (more than 18, since no optimal drawing of K_8 has a crossing-free triangle as its boundary), confirming a conjecture of Harary and Hill (1962). They quote Jensen's upper bound, found independently by Eggleton, and conjecture that it is exact (it isn't for n = 10, 12 or 13). Cited for the lower bounds for n = 8 and 9; those for n <= 7 were already known to Jensen (1971). Brodsky, Durocher and Gethner (2000, Table 1) cite it for n <= 9; Aichholzer, Aurenhammer and Krasser (2002) cite Erdős and Guy, Crossing number problems, Amer. Math. Monthly 80 (1973) 52-58 (January 1973), which was read: it repeats these results, crediting this paper for n = 8, and adds only that the rectilinear crossing number exceeds the ordinary one for n >= 10 (for n = 10, at least 61, already Singer's bound), so it isn't cited."
  added_by: daniel-munro

harary-hill-1963:
  string: "F. Harary, A. Hill, On the number of crossings in a complete graph, Proc. Edinburgh Math. Soc. (2) 13 (1962-63) 333-338."
  date: "1963-12"
  doi: "https://doi.org/10.1017/S0013091500025645"
  notes: "Received 1963-08-12; in the December 1963 issue. Introduces the rectilinear crossing number. Fig. 2 draws K_5 and K_6 with straight edges and says 'one can verify' that their rectilinear crossing numbers are 1 and 3; Figs. 6 and 7 draw K_8 and K_9 rectilinearly with 19 and 36 crossings. Its table of conjectured values gives 9 for n = 7 and 63 for n = 10, without rectilinear drawings, so those aren't credited to it. It conjectures, without proof, that 19 is optimal for n = 8 (proved by Guy 1972)."
  added_by: daniel-munro

jensen-1971:
  string: "H.F. Jensen, An upper bound for the rectilinear crossing number of the complete graph, J. Combin. Theory Ser. B 10 (1971) 212-216."
  date: "1971-06"
  doi: "https://doi.org/10.1016/0095-8956(71)90045-1"
  notes: "Received 1968-11-23; published in the June 1971 issue. Formula (1) gives a drawing of K_n with floor((7n^4 - 56n^3 + 128n^2 + 48n floor((n-7)/3) + 108)/432) crossings for each n. The upper bounds here are computed from it (9, 102, 156 and 231 for n = 7, 11, 12 and 13; for n = 6, 8 and 9 it matches the earlier drawings of Harary and Hill (1963); Brodsky, Durocher and Gethner (2000b, Table 3) give 630786 for n = 81); the paper lists no values. Not recorded for n = 10 and 81, where Singer's drawings of the same year have fewer crossings. Its Remarks say equality is known for n <= 7, which is cited for the lower bound for n = 7; the earlier source isn't named (it cites Guy 1960, which wasn't read, and Harary and Hill 1963, which only conjectures 9)."
  added_by: daniel-munro

singer-1971:
  string: "D. Singer, Rectilinear crossing numbers, manuscript, 1971."
  date: "1971"
  notes: "Unpublished, not read. Brodsky, Durocher and Gethner (2000) cite it, with Gardner's Knotted Doughnuts (1986), for the rectilinear crossing number of K_10 being 61 or 62, and reproduce its argument that it is more than 60. Their second paper (2000b, Table 3) gives Singer's recursive drawing of K_81 with 625320 crossings."
  added_by: daniel-munro

thorpe-harris-1996:
  string: "J.T. Thorpe, F.C. Harris, A parallel stochastic optimization algorithm for finding mappings of the rectilinear minimal crossing problem, Ars Combin. 43 (1996) 135-148."
  date: "1996"
  notes: "Read from the authors' preprint (dvips file ars.dvi). Its parallel genetic algorithm found drawings of K_12 and K_13 with 155 and 229 crossings (Table 1, Figures 2 and 3, with coordinates), beating Jensen's formula. Its other results for n <= 20 don't beat the formula. It mentions unpublished improvements by G. Exoo (private communication), which weren't found."
  added_by: daniel-munro

