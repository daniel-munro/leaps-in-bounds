  date: "1997"
  notes: "Gives coverings of the disk by 11 (with P. C. Schuur, disproving Krotoszyński 1993) and 12 circles. Not read; the upper bounds here are 1/2.631 and 1/2.769 from Friedman's page, which shows radii truncated to three decimals. Gáspár, Tarnai and Hincz 2014 say Nurmela (1998/1999) improved both, so Friedman's pictures may be Nurmela's."
