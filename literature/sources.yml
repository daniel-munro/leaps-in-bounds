  doi: "https://doi.org/10.1016/j.dam.2009.04.021"
  notes: "Not read directly. Completes the catalogue of graphs of maximum degree 3 and defect at most 4 (Miller-Širáň survey, p. 16); Miller (IWONT 2010 invited talk, p. 4) states the consequence n(3,k) <= M(3,k) - 6 for k >= 5, attributing it to 2008. Dated by its online appearance (Crossref record created 2009-05-16)."
  added_by: daniel-munro

feria-puron-miller-pineda-2010:
  string: "R. Feria-Purón, M. Miller and G. Pineda-Villavicencio, On graphs of defect at most 2, Discrete Applied Mathematics 159 (2011) 1331-1344, arXiv:1010.5658."
  date: "2010-10-27"
  url: "https://arxiv.org/abs/1010.5658"
  doi: "https://doi.org/10.1016/j.dam.2011.04.018"
  notes: "Section 7.1 (arXiv v1 and v2): Proposition 7.1, N(d,k) <= M(d,k) - 3 for even d >= 4 and k >= 4, and N(4,k) <= M(4,k) - 3 for k >= 3 (using Theorem 6.1, no (4,3,-2)-graph); Proposition 7.2, N(d,k) <= M(d,k) - 4 for odd d >= 5 and k >= 4 when M(d,k) - 2 is not divisible by k (Theorem 5.3; Corollary 7.1 is the case d = 0, 2 mod k). Section 1 notes that the earlier claimed proof of the case d = 4 by Miller and Simanjuntak (Discrete Math. 308 (2008)) contained a mistake."
  added_by: daniel-munro
