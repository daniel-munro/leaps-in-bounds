# Isosceles sets

erdos-1946:
  string: "P. Erdős, Problem E735, The American Mathematical Monthly 53 (1946) 394."
  date: "1946-08"
  doi: "https://doi.org/10.2307/2305860"
  notes: "Notes that six points in the plane, the vertices and center of a regular pentagon, have all triangles isosceles."
  added_by: daniel-munro

kelly-1947:
  string: "P. Erdős and L.M. Kelly, Solution to Problem E735: Isosceles n-points, The American Mathematical Monthly 54 (1947) 227-229."
  date: "1947-04"
  doi: "https://doi.org/10.2307/2304710"
  notes: "Kelly's solution: no isosceles set of 7 points in the plane, and an isosceles set of 8 points in 3-space."
  added_by: daniel-munro

croft-1962:
  string: "H.T. Croft, 9-point and 7-point configurations in 3-space, Proceedings of the London Mathematical Society (3) 12 (1962) 400-424."
  date: "1962"
  doi: "https://doi.org/10.1112/plms/s3-12.1.400"
  added_by: daniel-munro

blokhuis-1984:
  string: "A. Blokhuis, Few-distance sets, CWI Tract 7 (1984) 1-70."
  date: "1984"
  url: "https://ir.cwi.nl/pub/12716"
  notes: "Theorem 7.2.5 (p. 48): an isosceles set in R^n has at most (n+2 choose 2) points. Blokhuis' 1983 Eindhoven Ph.D. thesis, published as this tract. The theorem is also Theorem 6.3.3 of J.J. Seidel (notes by A. Blokhuis et al.), Graphs and association schemes, algebra and geometry, EUT-Report 83-WSK-02 (May 1983), which credits A. Blokhuis, Isosceles point sets in R^d, T.H.-Memo 1981-10, Eindhoven (1981)."
  added_by: daniel-munro

lisonek-1997:
  string: "P. Lisoněk, New maximal two-distance sets, Journal of Combinatorial Theory, Series A 77 (1997) 318-338."
  date: "1997-02"
  doi: "https://doi.org/10.1006/jcta.1997.2749"
  notes: "Received 1996-06-10. Table I classifies the largest two-distance sets for d <= 6, and the paper finds the largest ones in R^7 and R^8, including a 45-point set in R^8; every two-distance set is an isosceles set, though the paper doesn't mention isosceles sets. It doesn't add a center point to any of its sets, so it isn't the source of the C(n+1,2)+1 construction."
  added_by: daniel-munro

ionin-2009:
  string: "Y.J. Ionin, Isosceles sets, The Electronic Journal of Combinatorics 16 (2009) R141."
  date: "2009-11-24"
  doi: "https://doi.org/10.37236/230"
  notes: "Determines the largest isosceles sets in R^n for n <= 8, from the largest two-distance sets and Blokhuis' structure theorem."
  added_by: daniel-munro

kido-2008:
  string: "H. Kido, Classification of isosceles sets which have the maximum cardinality in 4-dimensional Euclidean space (in Japanese), RIMS Kôkyûroku 1593 (2008) 162-169 (Finite Groups and Algebraic Combinatorics, RIMS, Kyoto, 2007-12-17 to 2007-12-20)."
  date: "2008"
  url: "https://www.kurims.kyoto-u.ac.jp/~kyodo/kokyuroku/contents/pdf/1593-23.pdf"
  notes: "Section 1 (p. 165), Theorem 1.1 and Corollary 1.1: there are exactly two 11-point isosceles sets in R^4 up to similarity (the midpoints of the edges of a regular 4-simplex with its center, and two congruent regular pentagons in orthogonal planes with their common center), and no 12-point isosceles set, so the maximum is 11. Kido notes that 11-point isosceles sets in R^4 were already known, from Lisoněk's 10-point two-distance set with its center. Also in Kido's Kyushu University MI Preprint 2008-3 (October 2008), and published as H. Kido, On isosceles sets in the 4-dimensional Euclidean space, International Journal of Combinatorics 2010 (2010) 803210, https://doi.org/10.1155/2010/803210."
  added_by: daniel-munro

dobbelaere-sorting-networks:
  string: "B. Dobbelaere, Smallest and fastest sorting networks for a given number of inputs, https://bertdobbelaere.github.io/sorting_networks.html (page updated 2026-11-20, retrieved 2026-11-22)."
