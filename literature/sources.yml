# Lebesgue's universal covering problem

pal-1920:
  string: "J. Pál, Über ein elementares Variationsproblem, Det Kgl. Danske Videnskabernes Selskab, Mathematisk-fysiske Meddelelser III, 2 (1920) 3-35."
  date: "1920"
  notes: "Not read: no copy found. Sprague (1936), p. 96, lists Pál's results: the regular hexagon of width 1 is a universal cover, it can be cut down to an octagonal cover of area 2 - 2/√3 < 0.8453, and every universal cover has area greater than π/8 + √3/4 ≈ 0.8257. Brass and Sharifi (2005), pp. 1-2, describe the same cover and lower bound, the least area of the convex hull of a disk and an equilateral triangle of diameter 1, which Pál showed is reached when they're concentric."
  added_by: daniel-munro

sprague-1936:
  string: "R. Sprague, Über ein elementares Variationsproblem, Matematisk Tidsskrift B (1936) 96-99."
  date: "1936"
  url: "https://www.jstor.org/stable/24530328"
  notes: "§3: the part of Pál's cover near a third corner outside a circle of radius 1 can be cut off as well. Sprague doesn't compute the area; Brass and Sharifi (2005) say Meschkowski did. Baez, Bagdasaryan and Gibbs (2015), Section 1, give 0.844137708436, which is used here; Hansen (1975) and (1992) give it as 0.844144... and 0.84414."
  added_by: daniel-munro

hansen-1992:
  string: "H.C. Hansen, Small universal covers for sets of unit diameter, Geometriae Dedicata 42 (1992) 205-213."
  date: "1992-05"
  doi: "https://doi.org/10.1007/BF00147549"
  notes: "Received 1991-01-02. Abstract and p. 207: two corners of Sprague's cover, of areas 4·10^-11 and 6·10^-18, can be cut off, giving an asymmetric convex universal cover; no total area is stated. Baez, Bagdasaryan and Gibbs (2015), Section 2 and Table 1, recompute the areas as 3.7507·10^-11 and 8.4541·10^-21, giving 0.844137708398, which is used here. Hansen's earlier cover (Geometriae Dedicata 4 (1975) 165-172, doi:10.1007/BF00148751) cut two corners of area about 10^-19 from Sprague's (p. 166), too little to record at these digits; his 1981 Normat paper concerns covers for sets with an axis of symmetry only (p. 205)."
  added_by: daniel-munro

elekes-1994:
  string: "G. Elekes, Generalized breadths, circular Cantor sets, and the least area UCC, Discrete & Computational Geometry 12 (1994) 439-449."
  date: "1994-10"
  doi: "https://doi.org/10.1007/BF02574391"
  notes: "p. 440: the least area convex set covering a disk and all regular 3^j-gons of diameter 1 gives a lower bound of 0.8271, improving the circle-and-triangle bound 0.8257 (Theorem 2)."
  added_by: daniel-munro

brass-sharifi-2005:
  string: "P. Brass and M. Sharifi, A lower bound for Lebesgue's universal cover problem, International Journal of Computational Geometry & Applications 15(5) (2005) 537-544."
  date: "2005-10"
  doi: "https://doi.org/10.1142/S0218195905001828"
  notes: "Received 2005-01-18. Theorem 1: every convex universal cover has area at least 0.832, by a computer-assisted bound on the area of the convex hull of a disk, an equilateral triangle and a regular pentagon of diameter 1 over their placements (Section 2 shows at least 0.8323). pp. 1-3 recount the history: Pál's cover (0.8454) and lower bound π/8 + √3/4 ≈ 0.8257, and Elekes's ≈ 0.8271."
  added_by: daniel-munro

baez-bagdasaryan-gibbs-2015:
  string: "J.C. Baez, K. Bagdasaryan and P. Gibbs, The Lebesgue universal covering problem, Journal of Computational Geometry 6(1) (2015) 288-299, arXiv:1502.01251."
  date: "2015-02-04"
  url: "https://arxiv.org/abs/1502.01251"
  doi: "https://doi.org/10.20382/jocg.v6i1a12"
  notes: "Theorem 1: a convex universal cover of area at most 0.8441153, from Pál's hexagon with its corners cut at a slant angle of 1.3° and Sprague-like regions removed; computed in double precision (0.84411537685937650), and checked by Greg Egan to 2000 digits. Section 1 recounts the history of upper bounds, and Section 2 corrects Hansen's areas."
  added_by: daniel-munro

gibbs-2018:
  string: "P. Gibbs, An upper bound for Lebesgue's covering problem, arXiv:1810.10089 (2018)."
  date: "2018-10-23"
  url: "https://arxiv.org/abs/1810.10089"
  notes: "Theorem 1 and p. 18: a convex universal cover H(σ) of area less than 0.8440935944 at a slant angle σ < 1.5494°, refining the reductions of Baez, Bagdasaryan and Gibbs with reflection arguments like Hansen's. Not published in a journal (arXiv v1 only, as of 2026-11). pp. 1-2 recount the history of upper and lower bounds."
  added_by: daniel-munro

xie-2026:
  string: "N. Xie, A certified lower bound for Lebesgue's universal cover problem, arXiv:2606.04458 (2026)."
  date: "2026-06-03"
  url: "https://arxiv.org/abs/2606.04458"
  notes: "Every convex universal cover has area at least 0.833 (Corollary 1), by a computer-assisted proof in Brass and Sharifi's framework of a disk, a triangle and a pentagon of diameter 1: 356,816 parameter domains with outward-rounded interval bounds. The certificate records and a Python replay verifier are at https://github.com/Sheldon-Anderson/lebesgue-universal-cover-new-lower-bound-certificate; the verifier checks the records' hashes, counts and pass fields, not the geometry. Not published in a journal (arXiv v4, 2026-07-08)."
  added_by: daniel-munro

guy-kelly-1968-rp33:
  string: "R.K. Guy and P.A. Kelly, The no-three-in-line problem, Research Paper 33, Department of Mathematics, University of Calgary (January 1968)."
  date: "1968-01"
  url: "http://wwwhomes.uni-bielefeld.de/achim/no3in/R.K.Guy_P.A.Kelly_Research_paper_No_33_Jan.1968.pdf"
  notes: "p. 1: solutions with 2n points are known for n <= 9, found by hand (Acland-Hood and Guy, Bull. Malayan Math. Soc. 1952-53) and by computer (Kelly's 1967 master's thesis); Table I counts them. A row for n = 10 in Table I looks added later, in a different typeface. Also at https://oeis.org/A000755/a000755_1.pdf."
  added_by: daniel-munro

guy-kelly-1968:
  string: "R.K. Guy and P.A. Kelly, The no-three-in-line problem, Canadian Mathematical Bulletin 11 (1968) 527-531."
  date: "1968-10"
  doi: "https://doi.org/10.4153/CMB-1968-062-3"
  notes: "Received 1968-03-06; vol. 11 no. 4, October 1968. p. 527: f_n = 2n is known for 2 <= n <= 10 (Dudeney and Rouse Ball for n = 8, Acland-Hood 1952-53 for n = 10, also Guy 1952-53 and Kelly's 1967 thesis), with 1, 1, 4, 5, 11, 22, 57, 51 and 156 inequivalent configurations."
  added_by: daniel-munro

codish-et-al-2015:
  string: "M. Codish, L. Cruz-Filipe, T. Ehlers, M. Müller, P. Schneider-Kamp, Sorting networks: to the end and back again, Journal of Computer and System Sciences (online 2016), arXiv:1507.01428."
  date: "2015-07-06"
  url: "https://arxiv.org/abs/1507.01428"
  doi: "https://doi.org/10.1016/j.jcss.2016.04.004"
  notes: "Journal version of Ehlers and Müller (2015) with Codish, Cruz-Filipe and Schneider-Kamp. Table 1 (p. 4) gives the bounds on size and depth for up to 20 inputs, with their sources in the text, including lower bounds on size of 58, 63, 68 and 73 for 17 to 20 inputs, from S(16) >= 53 by Van Voorhis's S(n) >= S(n-1) + ceil(log2 n); no earlier statement of these was found."
  added_by: daniel-munro

lunnon-2013:
