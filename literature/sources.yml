isbell-1950:
  string: "J. R. Isbell, unpublished (1950), a 7-coloring of the plane by regular hexagons, reported in A. Soifer, The Mathematical Coloring Book, Springer (2009)."
  date: "1950-11"
  url: "https://www.cs.umd.edu/~gasarch/BLOGPAPERS/soifer.pdf"
  notes: "Not published at the time. Soifer's essay at the URL says Nelson posed the problem in November 1950, finding the lower bound 4, and that his friend John Isbell found the upper bound 7 then. MathWorld also dates it to 1950. The same hexagonal coloring, as a cover of the plane by 7 closed congruent sets each missing the distances in (2, √7), had been published by Hadwiger (1945)."
  added_by: daniel-munro

soifer-2009:
  string: "A. Soifer, The Mathematical Coloring Book: Mathematics of Coloring and the Colorful Life of its Creators, Springer (2009)."
  date: "2009"
  doi: "https://doi.org/10.1007/978-0-387-74642-5"
  added_by: daniel-munro

moser-moser-1961:
  string: "L. Moser and W. Moser, Solution to Problem 10, Canadian Mathematical Bulletin 4 (1961) 187-189."
  date: "1961-05"
  doi: "https://doi.org/10.1017/S0008439500025765"
  notes: "Problem P10 asks to prove that any 6 points in the plane can be 3-colored with no two points at unit distance of the same color, and that 6 can't be replaced by 7. The proposers' solution exhibits (Fig. 2) the 7-point configuration, the Moser spindle, that can't be 3-colored, so chi(R^2) >= 4. The DOI is for the issue's Solutions section, pp. 187-194. Gardner (Scientific American, October 1960) had already reported, from Leo Moser, that four colors are known to be necessary, so the bound is credited to Gardner. The problem itself was posed in an earlier issue of the Bulletin, not found."
  added_by: daniel-munro

gardner-1960:
  string: "M. Gardner, Mathematical Games: A new collection of \"brain-teasers\", Scientific American 203:4 (October 1960) 172-184."
  date: "1960-10"
  url: "https://www.jstor.org/stable/24940666"
  notes: "On p. 180, in the answer to the previous month's two-color triangle problem: Leo Moser, who sent the problem, writes that it isn't known how many colors are needed so that no two points at unit distance have the same color, and that four have been shown necessary and seven sufficient. No proof or construction is given; the 7-point Moser spindle appeared in Moser and Moser's solution to Problem 10 (Canadian Mathematical Bulletin, 1961). The earliest publication found of chi(R^2) >= 4. Soifer credits the bound to Edward Nelson in November 1950, unpublished."
  added_by: daniel-munro

hadwiger-1961:
  string: "H. Hadwiger, Ungelöste Probleme Nr. 40, Elemente der Mathematik 16 (1961) 103-104."
  date: "1961-09-10"
  notes: "Dated by its issue (Nr. 5, Basel, 10 September 1961). Asks for the least number of sets covering the plane with none containing two points at distance 1, and says that all that is known is 4 <= m <= 7, crediting the problem to E. Nelson and bounds to J. Isbell, from V. L. Klee. Proves m >= 4 by rotating a rhombus of two unit equilateral triangles about a vertex, and m <= 7 by the 7-coloring from Hadwiger (1945). Later than Gardner (1960) and Moser and Moser (1961), so it gives no new bound."
  added_by: daniel-munro

hadwiger-1945:
  string: "H. Hadwiger, Ueberdeckung des euklidischen Raumes durch kongruente Mengen, Portugaliae Mathematica 4 (1945) 238-242."
  date: "1945"
  url: "https://purl.pt/2142"
  notes: "Received 1945-06-30. On p. 239, the plane is covered by 7 closed congruent sets, each the union of the closed regular hexagons in the same position in a tiling by 18-gons made of 7 hexagons of side 1, and no set contains two points at any distance in (2, √7). Scaled, this is the 7-coloring of the plane, five years before Isbell found it (as Soifer reports). Cibulka (2007) cites this paper for chi(R^2) <= 7."
  added_by: daniel-munro

ivanov-2006:
  string: "L. L. Ivanov, An estimate for the chromatic number of the space R^4, Uspekhi Matematicheskikh Nauk 61:5 (2006) 181-182; Russian Mathematical Surveys 61 (2006) 984-986."
  date: "2006-10"
  url: "https://www.mathnet.ru/eng/rm5396"
  doi: "https://doi.org/10.1070/RM2006v061n05ABEH004361"
  notes: "Accepted 2006-09-28, in the September-October issue. Proves chi(R^4) >= 7, independently of Cantwell (1996). Its introduction states 6 <= chi(R^4) <= 49, crediting the upper bound to Coulson with no reference: the earliest public statement of 49 found. Coulson and Payne (2007) state it too, and Arman, Bondarenko, Prymak and Radchenko (2021) give the first proof."
  added_by: daniel-munro

cibulka-2007:
  string: "J. Cibulka, Ramsey-type questions in Euclidean space, diploma thesis, Charles University, Prague (2007)."
  date: "2007"
  url: "http://kam.mff.cuni.cz/~cibulka/papers/diplomka.pdf"
  notes: "Dated by the PDF on the author's website, created 2007-08-14. Section 2.2 proves chi(R^6) >= 11, later published in Cibulka (2008). Section 2.1 surveys earlier lower bounds: it credits Larman and Rogers (1972) with chi(R^5) >= 8 (the 5-dimensional half-cube), chi(R^6) >= 10 (by the spindle on that graph), chi(R^7) >= 14 (the 56-vertex Gosset graph) and chi(R^8) >= 16, and Raigorodskii (2001) with chi(R^7) >= 15."
  added_by: daniel-munro

kupavskii-2011-norm:
  string: "A. Kupavskiy, On the chromatic number of R^n with an arbitrary norm, Discrete Mathematics 311 (2011) 437-440."
  date: "2011-01-05"
  doi: "https://doi.org/10.1016/j.disc.2010.12.005"
  notes: "Received 2010-06-15, revised 2010-12-02, online 2011-01-05. Proves chi(R^n_K) <= (4+o(1))^n for any norm, and better for l_p norms; it gives no bound for the Euclidean chromatic number in small dimensions. Cherkashin, Kulikov and Raigorodskii (2015) cite it for chi(R^11) >= 25, which is instead in Kupavskii and Raigorodskii's EuroComb note (2009, Remark 2)."
  added_by: daniel-munro

kupavskii-2011-spheres:
  string: "A. B. Kupavskii, On the colouring of spheres embedded in R^n, Matematicheskii Sbornik 202:6 (2011) 83-110; Sbornik: Mathematics 202 (2011) 859-886."
  date: "2011-06"
  url: "https://www.mathnet.ru/eng/sm7676"
  doi: "https://doi.org/10.1070/SM2011v202n06ABEH004169"
  notes: "Received 2009-12-29 and, revised, 2010-09-16. Its abstract states chi(R^12) >= 27, obtained by lifting bounds on the chromatic numbers of spheres to higher dimensions; the bound is read from the abstract, not the full text. Cherkashin, Kulikov and Raigorodskii (2015) cite it for the same bound."
  added_by: daniel-munro

parts-2026-05-26:
  string: "J. Parts, comment of 2026-05-26 on D. G. Mixon, Polymath16, eighteenth thread: Back with a new conjecture! (blog post, 2026)."
  date: "2026-05-26"
  url: "https://dustingmixon.wordpress.com/2026/01/17/polymath16-eighteenth-thread-back-with-a-new-conjecture/"
  notes: "chi(R^7) >= 17, from a 952-vertex unit-distance graph on the E7 lattice with independence number 57. Raised to 18 on 2026-07-06 (parts-2026-07). Cited among Parts's comments in Table 1 of Davies (2026)."
  added_by: daniel-munro

polymath16-gibbs-2018-05-19:
  string: "P. Gibbs, comment of 2018-05-19 on D. G. Mixon, Polymath16, fifth thread: Human-verifiable proofs (blog post, 2018)."
  date: "2018-05-19"
  url: "https://dustingmixon.wordpress.com/2018/05/10/polymath16-fifth-thread-human-verifiable-proofs/"
  notes: "chi(R^6) <= 472, by a linear coloring of the permutohedron tiling with coefficients 1, 90, 100, 232, 237, 314, after 484 in a comment earlier the same day. Also reports that 156 is the best for R^5 by this method."
  added_by: daniel-munro

polymath16-gibbs-2018-05-25:
  string: "P. Gibbs, comment of 2018-05-25 on D. G. Mixon, Polymath16, fifth thread: Human-verifiable proofs (blog post, 2018)."
  date: "2018-05-25"
  url: "https://dustingmixon.wordpress.com/2018/05/10/polymath16-fifth-thread-human-verifiable-proofs/"
  notes: "chi(R^6) <= 462, by a linear coloring of the permutohedron tiling with coefficients 331, 161, 67, 49, 385; he checked most possibilities down to 450 without success. The Polymath16 wiki still listed 462 in November 2018 and October 2022 (Wayback Machine). Arman, Bondarenko, Prymak and Radchenko (2021) report that 448 was announced in this thread, but no 448 was found in it or in the sixth to eighth threads."
  added_by: daniel-munro

degrey-2018:
  string: "A. D. N. J. de Grey, The chromatic number of the plane is at least 5, Geombinatorics 28 (2018), arXiv:1804.02385."
  date: "2018-04-08"
  url: "https://arxiv.org/abs/1804.02385"
  notes: "A 1581-vertex unit-distance graph that can't be 4-colored, checked by computer. Smaller examples followed from the Polymath16 project, down to 509 vertices by 2021."
  added_by: daniel-munro

openai-2026-plane:
  string: "OpenAI, The Euclidean plane is not five-colorable, preprint dated September 23, 2026, in the openai/math repository on GitHub."
  date: "2026-10-06"
  url: "https://github.com/openai/math/tree/main/preprints/The-Euclidean-plane-is-not-five-colorable-September-23-2026"
  notes: "Proves in ZFC that every 5-coloring of the plane has a monochromatic unit-distance pair, with no assumption on the color classes, so 6 <= chi(R^2) <= 7. Not by a finite graph: it transfers proper colorings to weak measurable ones (a 'Haar rigidity' theorem) and rules out weak measurable 5-colorings. Written by an unnamed OpenAI model and posted, unrefereed, in a bulk release on 2026-10-06 (the repository's first commit), with a Lean proof of the theorem; an independent audit (github.com/punk01-shaka/hadwiger-nelson-audit) rechecked the Lean proof against a statement written from scratch. Read through others' reports of the abstract, theorem and Lean statement, not directly."
  added_by: daniel-munro

raiskii-1968:
  string: "D. E. Raiskii, Realization of all distances in a decomposition of the space R^n into n+1 parts, Matematicheskie Zametki 7 (1970) 319-323; Mathematical Notes 7 (1970) 194-196."
  date: "1968-12-10"
  url: "https://www.mathnet.ru/eng/mzm9512"
  doi: "https://doi.org/10.1007/BF01093113"
  notes: "Dated by its receipt. Proves that if R^n (n > 1) is the union of n+1 disjoint sets, one of them realizes every distance, so chi(R^n) >= n + 2, by a spindle of two regular simplices (the Moser-Raiskii spindle). Hadwiger (1944) had proved this for closed sets."
  added_by: daniel-munro

larman-rogers-1972:
  string: "D. G. Larman and C. A. Rogers, The realization of distances within sets in Euclidean space, Mathematika 19 (1972) 1-24."
  date: "1972-06"
  doi: "https://doi.org/10.1112/S0025579300004903"
  notes: "Received 1972-01-31; June 1972 issue. Theorem 4(b), with Table 1: if R^n is covered by fewer than N_n sets, one of them realizes every distance, so chi(R^n) >= ceil(N_n), with N_n = 8 (n = 5, the half-cube), 9 7/8 (n = 6, the half-cube spindle), 14 (n = 7, the Gosset polytope), 16 (n = 8, 9, 10) and 17 15/16 (n = 11, 12, 13). A note added on 1972-05-25 uses an Erdős-Sós lemma on triples (Lemma 18) to replace N_n by (n+1)n/6 for n = 1, 2 (mod 4), n(n-1)/6 for n = 3 (mod 4) and (n+1)(n-1)/6 for n = 0 (mod 4), for 10 <= n <= 22, giving chi(R^10) >= 19, chi(R^11) >= 19 and chi(R^12) >= 24; the numbers aren't written out in the paper, but Kupavskii and Raigorodskii (2008, 2009) credit it with 19 and 24 for n = 10 and 12. Also proves chi(R^n) <= (3+o(1))^n (Assertion 1)."
  added_by: daniel-munro

szekely-wormald-1989:
  string: "L. A. Székely and N. C. Wormald, Bounds on the measurable chromatic number of R^n, Discrete Mathematics 75 (1989) 343-372."
  date: "1989-05"
  doi: "https://doi.org/10.1016/0012-365X(89)90099-X"
  notes: "Its introduction (p. 347) states 5 <= chi(R^3) <= chi_m(R^3) <= 21, crediting the lower bound to Raiskii and saying of the upper bound only that the coloring is an exercise for the reader; no earlier source for 21 is given. Coulson (1997) credits a 21-coloring based on the face-centered cubic lattice to Soifer."
  added_by: daniel-munro

cantwell-1996:
  string: "K. Cantwell, Finite Euclidean Ramsey theory, Journal of Combinatorial Theory, Series A 73 (1996) 273-285."
  date: "1996-02"
  doi: "https://doi.org/10.1006/jcta.1996.0022"
  notes: "Received 1994-10-20. Theorem 3.1: chi(R^4) >= 7; Theorem 4.1: chi(R^5) >= 9. It cites Larman and Rogers (1972) for the earlier lower bounds 4, 5, 6 and 8 for n = 2 to 5. Ivanov (2006) and Cibulka (2008) later proved chi(R^4) >= 7 independently."
  added_by: daniel-munro

coulson-1997:
  string: "D. Coulson, An 18-colouring of 3-space omitting distance one, Discrete Mathematics 170 (1997) 241-247."
  date: "1997-06"
  doi: "https://doi.org/10.1016/S0012-365X(96)00309-3"
  notes: "Received 1995-04-24. A coloring by cells of the body-centered cubic lattice."
  added_by: daniel-munro

raigorodskii-2001:
  string: "A. M. Raigorodskii, Borsuk's problem and the chromatic numbers of some metric spaces, Uspekhi Matematicheskikh Nauk 56:1 (2001) 107-146; Russian Mathematical Surveys 56 (2001) 103-139."
  date: "2001"
  url: "https://www.mathnet.ru/eng/rm358"
  doi: "https://doi.org/10.1070/RM2001v056n01ABEH000358"
  notes: "Received 2000-12-07. Section 4.1 proves chi(R^7) >= 15 (a 126-vertex graph in R^8 lying in a hyperplane) and chi(R^11) >= 20, along with chi(Q^9) >= 12. Read in the Russian version."
  added_by: daniel-munro

coulson-2002:
  string: "D. Coulson, A 15-colouring of 3-space omitting distance one, Discrete Mathematics 256 (2002) 83-90."
  date: "2002-09"
  doi: "https://doi.org/10.1016/S0012-365X(01)00183-2"
  notes: "Received 1998-12-09. Radoičić and Tóth (2003) found a very similar 15-coloring independently. Also shows that colorings of R^n by a lattice and sublattice need at least 2^(n+1) - 1 colors."
  added_by: daniel-munro

nechushtan-2002:
  string: "O. Nechushtan, On the space chromatic number, Discrete Mathematics 256 (2002) 499-507."
  date: "2002-09"
  doi: "https://doi.org/10.1016/S0012-365X(00)00406-4"
  notes: "Received 2000-01-29, revised 2000-06-26, accepted 2000-07-26. Proves chi(R^3) >= 6, improving Raiskii's 5. It gives 21 as the best known upper bound, so it doesn't know of Coulson's 18 (1997)."
  added_by: daniel-munro

radoicic-toth-2003:
  string: "R. Radoičić and G. Tóth, Note on the chromatic number of the space, in: Discrete and Computational Geometry: The Goodman-Pollack Festschrift, Algorithms and Combinatorics 25, Springer (2003) 695-698."
  date: "2003"
  url: "https://www.cs.bme.hu/~geza/chromatic.pdf"
  doi: "https://doi.org/10.1007/978-3-642-55566-4_32"
  notes: "Proves chi(R^3) <= 15 by tiling with permutahedra, found independently of Coulson (2002). Remark 3 states, without proof, that the method gives a 54-coloring of R^4."
  added_by: daniel-munro

coulson-payne-2007:
  string: "M. S. Payne and D. Coulson, A dense distance 1 excluding set in R^3, Gazette of the Australian Mathematical Society 34 (2007) 97-102."
  date: "2007-05"
  url: "https://oldsite.austms.org.au/Gazette/2007/May07/097TechCoulson.pdf"
  notes: "Table 1 lists chi(R^4) <= 49, 'demonstrated by a lattice/sublattice colouring', without proof. Arman, Bondarenko, Prymak and Radchenko (2021) prove it. The same table cites Raiskii for chi(R^4) >= 6."
  added_by: daniel-munro

cibulka-2008:
  string: "J. Cibulka, On the chromatic number of real and rational spaces, Geombinatorics 18 (2008) 53-65."
  date: "2008"
  url: "https://iuuk.mff.cuni.cz/~cibulka/chromspace"
  notes: "Not read directly. Credited with chi(R^6) >= 11 by Exoo and Ismailescu (2014), which first appeared in his 2007 diploma thesis (cibulka-2007); also gives new proofs of chi(R^4) >= 7 and chi(R^5) >= 9."
  added_by: daniel-munro

kupavskii-raigorodskii-2009:
  string: "A. B. Kupavskii and A. M. Raigorodskii, On the chromatic number of R^9, Fundamentalnaya i Prikladnaya Matematika 14:5 (2008) 139-154; Journal of Mathematical Sciences 163 (2009) 720-731."
  date: "2008"
  url: "https://www.mathnet.ru/eng/fpm1146"
  doi: "https://doi.org/10.1007/s10958-009-9708-4"
  notes: "Theorem 1: chi(R^9) >= 21; Theorem 3: chi(R^10) >= 23. It says the result also improves the bound for n = 11, which then follows as chi(R^11) >= chi(R^10) >= 23. Its table of earlier lower bounds credits chi(R^10) >= 19 and chi(R^12) >= 24 to Larman and Rogers (1972), chi(R^7) >= 15 and chi(R^11) >= 20 to Raigorodskii (2001), and chi(R^8) >= 16 and chi(R^9) >= 16 to Székely (2002), noting that Székely doesn't say who first proved them. Exoo and Ismailescu (2014) cite the paper for chi(R^11) >= 24, which isn't in it."
  added_by: daniel-munro

kupavskii-raigorodskii-2009-endm:
  string: "A. B. Kupavskii and A. M. Raigorodskii, On the chromatic numbers of small-dimensional Euclidean spaces, Electronic Notes in Discrete Mathematics 34 (2009) 435-439 (EuroComb 2009)."
  date: "2009-09"
  doi: "https://doi.org/10.1016/j.endm.2009.07.072"
  notes: "Dated by the EuroComb 2009 conference (Bordeaux, September 2009); the PDF was made in July 2009. Theorem 1: chi(R^9) >= 21, chi(R^10) >= 23, chi(R^11) >= 23, chi(R^12) >= 25; Remark 2: Theorem 1 with a lifting theorem (Theorem 2: a bound m from a graph on a suitable sphere in R^n gives chi(R^{n+2}) >= m + 4) gives chi(R^11) >= 25. The bounds for n = 9, 10 and 11 (23) appeared first in the authors' paper on R^9 (2008). Section 2 surveys earlier lower bounds for 5 <= n <= 12: 9 (Cantwell 1996), 11 (Cibulka 2008), 15 (Raigorodskii 2001), 16 and 16 for n = 8 and 9 (Székely 2002), 19 (Larman and Rogers 1972), 20 (Raigorodskii 2001), 24 (Larman and Rogers 1972)."
  added_by: daniel-munro

exoo-ismailescu-lim-2014:
  string: "G. Exoo, D. Ismailescu and M. Lim, On the chromatic number of R^4, Discrete & Computational Geometry 52 (2014) 416-423."
  date: "2014-08-09"
  doi: "https://doi.org/10.1007/s00454-014-9612-7"
  notes: "A 65-vertex unit-distance graph in R^4 with chromatic number 9. Received 2013-10-19, online 2014-08-09."
  added_by: daniel-munro

exoo-ismailescu-2014:
  string: "G. Exoo and D. Ismailescu, On the chromatic number of R^n for small values of n, arXiv:1408.2002 (2014)."
  date: "2014-08-09"
  url: "https://arxiv.org/abs/1408.2002"
  notes: "Improves the lower bounds for n = 6, 7, 10, 11, 12, 13, 14 (Table 1). The bound chi(R^12) >= 36 comes from a graph on 1716 vertices whose independence number is stated as 46, which would give 38; 36 would follow from 48."
  added_by: daniel-munro

kahle-taha-2014:
  string: "M. Kahle and B. Taha, New lower bounds on chi(R^d), d = 8, ..., 12, arXiv:1409.1278 (2014)."
  date: "2014-09-03"
  url: "https://arxiv.org/abs/1409.1278"
  notes: "Theorem 1.1: chi(R^8) >= 19, chi(R^9) >= 21, chi(R^10) >= 26, chi(R^11) >= 32, chi(R^12) >= 32."
  added_by: daniel-munro

cherkashin-kulikov-raigorodskii-2015:
  string: "D. Cherkashin, A. Kulikov and A. Raigorodskii, On the chromatic numbers of small-dimensional Euclidean spaces, Discrete Applied Mathematics 243 (2018) 125-131, arXiv:1512.03472."
  date: "2015-12-10"
  url: "https://arxiv.org/abs/1512.03472"
  notes: "Theorem 2 gives chi(R^10) >= 30, chi(R^11) >= 35, chi(R^12) >= 37, and Proposition 1 gives chi(R^9) >= 22."
  added_by: daniel-munro

polymath16-2018-05:
  string: "A. de Grey (as ag24ag24), comment of 2018-05-14 on D. G. Mixon, Polymath16, fifth thread: Human-verifiable proofs (blog post, 2018)."
  date: "2018-05-14"
  url: "https://dustingmixon.wordpress.com/2018/05/10/polymath16-fifth-thread-human-verifiable-proofs/"
  notes: "Reports '(very provisional)' upper bounds chi(R^5) <= 156 and chi(R^6) <= 564, found a few months earlier by the permutohedron approach of Radoičić and Tóth. Philip Gibbs reproduced 156 on 2018-05-17 and lowered the bound for R^6 in later comments (polymath16-gibbs-2018-05-19, polymath16-gibbs-2018-05-25). Arman, Bondarenko, Prymak and Radchenko (2021) cite this thread for 156 and 448."
  added_by: daniel-munro

arman-bondarenko-prymak-radchenko-2021:
  string: "A. Arman, A. Bondarenko, A. Prymak and D. Radchenko, Upper bounds on chromatic number of E^n in low dimensions, Electronic Journal of Combinatorics 31(2) (2024) #P2.35, arXiv:2112.13438."
  date: "2021-12-26"
  url: "https://arxiv.org/abs/2112.13438"
  doi: "https://doi.org/10.37236/11794"
  notes: "Colorings by cosets of sublattices: chi(R^5) <= 140, chi(R^7) <= 1372 and chi(R^9) <= 17253 (computer-assisted); chi(R^n) <= 7^(n/2) for n = 4, 6, 8, 24 (a proof of Coulson's 49 for n = 4); and chi(R^n) <= 3^n for n <= 38 and n = 48, 49."
  added_by: daniel-munro

parts-2026-03:
  string: "J. Parts, The chromatic number of R^8 is at least 25, arXiv:2603.14581 (2026)."
  date: "2026-03-15"
  url: "https://arxiv.org/abs/2603.14581"
  added_by: daniel-munro

parts-2026-05:
  string: "J. Parts, comment of 2026-05-20 on D. G. Mixon, Polymath16, eighteenth thread: Back with a new conjecture! (blog post, 2026)."
  date: "2026-05-20"
  url: "https://dustingmixon.wordpress.com/2026/01/17/polymath16-eighteenth-thread-back-with-a-new-conjecture/"
  notes: "chi(R^6) >= 14, from a 940-vertex unit-distance graph on the E6 lattice with independence number 72. Cited in Table 1 of Davies (2026)."
  added_by: daniel-munro

parts-2026-07:
  string: "J. Parts, comment of 2026-07-06 on D. G. Mixon, Polymath16, eighteenth thread: Back with a new conjecture! (blog post, 2026)."
  date: "2026-07-06"
  url: "https://dustingmixon.wordpress.com/2026/01/17/polymath16-eighteenth-thread-back-with-a-new-conjecture/"
  notes: "chi(R^7) >= 18, from a 952-vertex unit-distance graph on the E7 lattice with independence number 57 (after 17 on 2026-05-26), and preliminary bounds chi(R^9) >= 30 and chi(R^10) >= 33. Cited in Table 1 of Davies (2026)."
  added_by: daniel-munro

ivanov-glushkova-2026:
  string: "L. L. Ivanov and N. V. Glushkova, New upper bounds for the chromatic numbers of Euclidean spaces, arXiv:2609.20436 (2026)."
  date: "2026-09-17"
  url: "https://arxiv.org/abs/2609.20436"
  notes: "Colorings by cosets of sublattices with exact rational certificates: chi(R^4) <= 43, chi(R^5) <= 132, chi(R^7) <= 1029, chi(R^9) <= 7203, and chi(R^10) <= 45619 by a product construction. Code and certificates at https://github.com/ivaleo/Chromatic."
  added_by: daniel-munro

davies-2026:
  string: "J. Davies, Measurable obstructions for unmeasurable colourings, arXiv:2610.12301 (2026)."
  date: "2026-10-08"
  url: "https://arxiv.org/abs/2610.12301"
  notes: "Proves that the chromatic number of R^d equals its measurable chromatic number for d >= 4 (and for d >= 5 equals that of Q^d), so lower bounds on the measurable chromatic number from density certificates hold for all colorings. Table 1 and Theorem 9.1 give chi(R^4) >= 11 (from the measurable bound of DeCorte, de Oliveira Filho and Vallentin) and new bounds for 5 <= d <= 24. Unrefereed preprint; its certificates come as a computational supplement."
  added_by: daniel-munro

koshelev-kupavskii-voronov-2026:
  string: "M. Koshelev, A. Kupavskii and V. Voronov, Ordinary and measurable colorings of Euclidean three-space, arXiv:2610.18907 (2026)."
  date: "2026-10-11"
  url: "https://arxiv.org/abs/2610.18907"
  notes: "Every finite proper coloring of R^3 can be replaced by a measurable one with the same number of colors, so chi(R^3) is at least the measurable bound 7 of de Oliveira Filho and Vallentin (Corollary 1.2). Assumes the Haar rigidity theorem (Theorem 2.3) of OpenAI's preprint 'The Euclidean plane is not five-colorable', which has a Lean proof."
  added_by: daniel-munro

schaer-meir-1965:
  string: "J. Schaer, A. Meir, On a geometric extremum problem, Canadian Mathematical Bulletin 8(1) (1965) 21-27."
  date: "1965-02"
  doi: "https://doi.org/10.4153/CMB-1965-004-x"
  notes: "Proves the optimal packing of 8 circles in a square, and reports that R. L. Graham had found the optimal packing of 6, whose proof he never published."
  added_by: daniel-munro

schaer-1965:
  string: "J. Schaer, The densest packing of 9 circles in a square, Canadian Mathematical Bulletin 8(3) (1965) 273-277."
  date: "1965-04"
  doi: "https://doi.org/10.4153/CMB-1965-018-9"
  notes: "Proves the optimal packing of 9 circles, and lists the optimal packings for up to 9 circles, including that of 7, whose proof by Schaer was not published."
  added_by: daniel-munro

goldberg-1970:
  string: "M. Goldberg, The packing of equal circles in a square, Mathematics Magazine 43(1) (1970) 24-30."
  date: "1970-01"
  doi: "https://doi.org/10.1080/0025570X.1970.11975991"
  notes: "Table 1 gives the best packings Goldberg found of up to 27 circles, as the minimum distance m between n points in a unit square (s = 2 + 2/m); Table 2 adds 30 circles, m = (20 - sqrt(10))/75, among others. Exact for 12, 18, 20, 23, 24, 27 and 30, which were later proved optimal. Some values are given to three or four digits only (11: .398, 17: .3045, 21: .2704, 26: .2373); for 11 the more precise m = 0.398012 is from Mollard and Payan (1990). For 19 it gives m = .290 from an equation solved by successive approximation, which as printed gives m = 0.289537, just below the optimum 0.289542, so no bound is taken from it; Maranas, Floudas and Pardalos (1995) attribute the optimal value to Goldberg, while Peikert (1994) says the optimal packing of 19 was new in 1991."
  added_by: daniel-munro

schwartz-1970:
  string: "B. L. Schwartz, Separating points in a square, Journal of Recreational Mathematics 3 (1970) 195-204."
  date: "1970"
  notes: "The first published proof for 6 circles, according to Melissen (1994)."
  added_by: daniel-munro

schluter-1979:
  string: "K. Schlüter, Kreispackung in Quadraten, Elemente der Mathematik 34 (1979) 12-14."
  date: "1979"
  url: "https://www.e-periodica.ch/digbib/view?pid=edm-001:1979:34"
  notes: "Gives packings of 10 and 13 circles better than Goldberg's (1970), with minimum distances 0.42127954 (optimal) and (sqrt(3)-1)/2 between points in a unit square (table in section 3), found in Schlüter's Diplomarbeit at Stuttgart. Peikert (1994) says Schlüter found the packing of 10 'bereits 1971', citing this 1979 paper."
  added_by: daniel-munro

mollard-payan-1990:
  string: "M. Mollard, C. Payan, Some progress in the packing of equal circles in a square, Discrete Mathematics 84(3) (1990) 303-307."
  date: "1990"
  doi: "https://doi.org/10.1016/0012-365X(90)90135-5"
  notes: "Received 1990-04-19. Gives the optimal packings of 11 (m = 0.398207), 13 (m = 0.366096007) and 14 (s = 3.866025 for unit-diameter circles) circles, improving Goldberg's (1970), and of 10 (m = 0.42127954), unaware of Schlüter (1979). Maranas, Floudas and Pardalos (1995) say Wengerodt (1987) had already given the packing of 14, and that de Groot, Peikert and Würtz (1990) independently found those of 11 and 13."
  added_by: daniel-munro

de-groot-peikert-wurtz-1990:
  string: "C. de Groot, R. Peikert, D. Würtz, The optimal packing of ten equal circles in a square, IPS Research Report No. 90-12, ETH Zürich, 1990."
  date: "1990-08"
  notes: "Not read (not online). Nurmela and Östergård (1997) say it gives good packings for up to 22 circles; its packings of 15 (m = 0.33860952) and 22 (m = 0.26795840) are known from Maranas, Floudas and Pardalos (1995), and its packing of 21, which Nurmela and Östergård improved, has no known value."
  added_by: daniel-munro

schaer-1971:
  string: "J. Schaer, On the packing of ten equal circles in a square, Mathematics Magazine 44(3) (1971) 139-140."
  date: "1971-05"
  doi: "https://doi.org/10.1080/0025570X.1971.11976123"
  notes: "Improves Goldberg's packing of 10 circles to m ≈ .4195 (Fig. 2; the exact expression is garbled in the scan). The bound uses the value m = 0.41954209 given for it by Maranas, Floudas and Pardalos (1995)."
  added_by: daniel-munro

maranas-floudas-pardalos-1995:
  string: "C. D. Maranas, C. A. Floudas, P. M. Pardalos, New results in the packing of equal circles in a square, Discrete Mathematics 142 (1995) 287-293."
  date: "1995-07"
