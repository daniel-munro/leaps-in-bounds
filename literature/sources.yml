bose-nelson-1962:
  string: "R.C. Bose, R.J. Nelson, A sorting problem, Journal of the ACM 9 (1962) 282-296."
  date: "1962-04"
  doi: "https://doi.org/10.1145/321119.321126"
  notes: "Values from Table 1 of Floyd and Knuth (1970)."
  added_by: daniel-munro

floyd-1964:
  string: "R.W. Floyd, A minute improvement in the Bose-Nelson sorting procedure, memo, Computer Associates, February 1964."
  date: "1964-02"
  notes: "Unpublished; a network for 9 inputs with 25 comparators, cited in Floyd and Knuth (1970)."
  added_by: daniel-munro

batcher-1964:
  string: "K.E. Batcher, A new internal sorting method, Goodyear Aerospace report GER-11759, September 1964."
  date: "1964-09"
  notes: "The odd-even merge sort; values from Table 1 of Floyd and Knuth (1970). Published as Batcher (1968)."
  added_by: daniel-munro

batcher-1968:
  string: "K.E. Batcher, Sorting networks and their applications, AFIPS Spring Joint Computer Conference 32 (1968) 307-314."
  date: "1968-04-30"
  doi: "https://doi.org/10.1145/1468075.1468121"
  url: "https://www.cs.kent.edu/~batcher/sort.pdf"
  notes: "Sorts 2^p inputs in p(p+1)/2 steps, and so n inputs in that many steps for n <= 2^p, by leaving out wires."
  added_by: daniel-munro

floyd-knuth-1970:
  string: "R.W. Floyd, D.E. Knuth, The Bose-Nelson sorting problem, Stanford report STAN-CS-70-177, November 1970. Also in A Survey of Combinatorial Theory, North-Holland (1973) 163-172."
  date: "1970-11"
  url: "http://bitsavers.informatik.uni-stuttgart.de/pdf/stanford/Stanford_CS_TR_Collection_2025-12-12/PDF/1970/CS-TR-70-177.pdf"
  doi: "https://doi.org/10.1016/B978-0-7204-2262-7.50020-X"
  notes: "Proves S(n) for n <= 8 (Theorems 3 and 4; for 7 inputs, a 1966 computer search by R. Grove). Table 1 gives the best upper bounds known in 1969, including unpublished networks by Waksman (10 inputs) and Shapiro and Green (11, 12 and 16 inputs), and the best lower bounds known in 1966."
  added_by: daniel-munro

kautz-pease-green-1970:
  string: "W.H. Kautz, M.C. Pease, M.W. Green, Cellular logic-in-memory arrays, Final Report Part 1, SRI Project 5509, Stanford Research Institute, May 1970."
  date: "1970-05"
  notes: "Not seen; cited by Van Voorhis (1971), Table 2, for the sizes previously reported for 17 to 32 inputs."
  added_by: daniel-munro

van-voorhis-1971:
  string: "D.C. Van Voorhis, A generalization of the divide-sort-merge strategy for sorting networks, Technical Report 16, Digital Systems Laboratory, Stanford University (STAN-CS-71-237), August 1971."
  date: "1971-08"
  url: "http://bitsavers.informatik.uni-stuttgart.de/pdf/stanford/Stanford_CS_TR_Collection_2025-12-12/PDF/1971/CS-TR-71-237.pdf"
  notes: "Table 2 (pp. 49-50) gives the smallest known sizes for up to 36 inputs, marking those new in the report: 79 for 18, 141 for 26, 150 for 27 and 156 for 28 inputs."
  added_by: daniel-munro

van-voorhis-1972:
  string: "D.C. Van Voorhis, An improved lower bound for sorting networks, IEEE Transactions on Computers C-21 (1972) 612-613."
  date: "1972-06"
  doi: "https://doi.org/10.1109/TC.1972.5009021"
  notes: "Proves S(n) >= S(n-1) + ceil(log2 n), first in Stanford Digital Systems Laboratory Technical Note 7 (February 1971). The resulting lower bounds for 9 to 16 inputs are from Codish et al. (2014)."
  added_by: daniel-munro

knuth-1973:
  string: "D.E. Knuth, The Art of Computer Programming, Vol. 3: Sorting and Searching, Addison-Wesley, 1973, Section 5.3.4."
  date: "1973"
  notes: "Gives the fastest known networks for up to 16 inputs, by Shapiro and Van Voorhis, and the optimal depths for up to 8 inputs. Values from Table 1 of Parberry (1991)."
  added_by: daniel-munro

parberry-1989:
  string: "I. Parberry, A computer assisted optimal depth lower bound for sorting networks with nine inputs, Proceedings of Supercomputing '89 (1989) 152-161."
  date: "1989-11-13"
  doi: "https://doi.org/10.1145/76263.76280"
  notes: "Shows that no network of depth 6 sorts 9 inputs, so D(9) = D(10) = 7."
  added_by: daniel-munro

parberry-1991:
  string: "I. Parberry, A computer-assisted optimal depth lower bound for nine-input sorting networks, Mathematical Systems Theory 24 (1991) 101-116."
  date: "1991"
  doi: "https://doi.org/10.1007/BF02090393"
  url: "https://ianparberry.com/pubs/9-input.pdf"
  notes: "Journal version of Parberry (1989). Table 1 gives the known bounds on depth for up to 16 inputs."
  added_by: daniel-munro

juille-1995:
  string: "H. Juillé, Evolution of non-deterministic incremental algorithms as a new approach for search in state spaces, Proceedings of the 6th International Conference on Genetic Algorithms (1995) 351-358."
  date: "1995-07"
  notes: "A network for 13 inputs with 45 comparators. Not seen; cited by Valsalam and Miikkulainen (2013) and Baddar (2009)."
  added_by: daniel-munro

baddar-batcher-2009:
  string: "S.W. Al-Haj Baddar, K.E. Batcher, An 11-step sorting network for 18 elements, Parallel Processing Letters 19 (2009) 97-103."
  date: "2009-03"
  doi: "https://doi.org/10.1142/S0129626409000092"
  notes: "First as Kent State University technical report TR-KSU-CS-2007-06 (2007). Leaving out a wire gives depth 11 for 17 inputs."
  added_by: daniel-munro

baddar-2009:
  string: "S.W. Al-Haj Baddar, Finding Better Sorting Networks, PhD thesis, Kent State University, 2009."
  date: "2009-04"
  url: "https://etd.ohiolink.edu/acprod/odb_etd/r/etd/search/10?p10_accession_num=kent1239814529"
  notes: "Table 3.2 (p. 34) gives sizes of 133 and 140 for 25 and 26 inputs. Also a network of depth 12 for 22 inputs (first in technical report TR-KSU-CS-2008-05, 2008), and so for 21 inputs, credited by Dobbelaere's list."
  added_by: daniel-munro

valsalam-2010:
  string: "V.K. Valsalam, Utilizing Symmetry in Evolutionary Design, PhD thesis, University of Texas at Austin, Technical Report AI-10-04, August 2010."
  date: "2010-08"
  url: "https://nn.cs.utexas.edu/downloads/papers/valsalam.phdtr10.pdf"
  notes: "Table 7.1 (p. 76): smaller networks for 17 to 20 and 22 inputs."
  added_by: daniel-munro

valsalam-miikkulainen-2013:
  string: "V.K. Valsalam, R. Miikkulainen, Using symmetry and evolutionary search to minimize sorting networks, Journal of Machine Learning Research 14 (2013) 303-331."
  date: "2013-02"
  url: "https://jmlr.org/papers/v14/valsalam13a.html"
  notes: "Table 4: a network for 21 inputs with 102 comparators, and the networks of Valsalam (2010)."
  added_by: daniel-munro

bundala-zavodny-2013:
  string: "D. Bundala, J. Závodný, Optimal sorting networks, LATA 2014, LNCS 8370 (2014) 236-247, arXiv:1310.6271."
  date: "2013-10-23"
  url: "https://arxiv.org/abs/1310.6271"
  doi: "https://doi.org/10.1007/978-3-319-04921-2_19"
  notes: "Proves D(11) = D(12) = 8 (Theorem 1) and D(n) = 9 for 13 <= n <= 16 (Theorem 2), with a SAT solver."
  added_by: daniel-munro

codish-et-al-2014:
  string: "M. Codish, L. Cruz-Filipe, M. Frank, P. Schneider-Kamp, Twenty-five comparators is optimal when sorting nine inputs (and twenty-nine for ten), ICTAI 2014, arXiv:1405.5754. Also Journal of Computer and System Sciences 82 (2016) 551-563."
  date: "2014-05-22"
  url: "https://arxiv.org/abs/1405.5754"
  doi: "https://doi.org/10.1016/j.jcss.2015.11.014"
  notes: "Proves S(9) = 25 and S(10) = 29, and so new lower bounds for 11 to 16 inputs (table on p. 3), which also lists the older lower bounds."
  added_by: daniel-munro

ehlers-muller-2014:
  string: "T. Ehlers, M. Müller, Faster sorting networks for 17, 19 and 20 inputs, Technical report 1406, Kiel University, 2014, arXiv:1410.2736."
  date: "2014-10-08"
  url: "https://arxiv.org/abs/1410.2736"
  notes: "Networks of depth 10 for 17 inputs and 11 for 19 and 20 inputs (Table 1, Figures 3 and 4). Table 1 also lists the earlier bounds for 17 to 20 inputs."
  added_by: daniel-munro

ehlers-muller-2015:
  string: "T. Ehlers, M. Müller, New bounds on optimal sorting networks, CiE 2015, LNCS 9136 (2015) 167-176, arXiv:1501.06946."
  date: "2015-01-27"
  url: "https://arxiv.org/abs/1501.06946"
  doi: "https://doi.org/10.1007/978-3-319-20028-6_17"
