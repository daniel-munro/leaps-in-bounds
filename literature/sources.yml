  date: "1967"
  doi: "https://doi.org/10.1016/S0021-9800(67)80026-7"
  notes: "A snake here is an induced cycle (a coil). Corollary 1 gives S(d) >= 2^(d+1)/d for d a power of 2, so S(8) >= 64, and Theorem A gives S(9) >= 8 S(5) = 112 (proof of Corollary 4). The introduction reports Kautz's upper bound S(d) <= (d/(d-1)) 2^(d-1), with the multiplier reduced to 1 by Singleton (1966) and Abbott (1965 thesis)."
