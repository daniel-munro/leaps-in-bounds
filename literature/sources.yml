vonequinox-2026:
  string: "VonEquinox, DiskCoveringSolve: computer-assisted global optimality proofs for covering the unit disk with n = 11 to 20 equal disks, GitHub repository, commits of 2026-09-04 (n = 11, 12) and 2026-09-05 (n = 13 to 20). Erich Friedman's Circles Covering Circles credits these proofs to Yuao Zhang and Zhenyue Zhou (2026)."
  date: "2026-09-05"
  url: "https://github.com/VonEquinox/DiskCoveringSolve/tree/089584973f41e6374ce110f6e5b5ee456df19352"
  notes: "Exact certificates (rational Krawczyk root isolation, Farkas certificates, exhaustive triangulation and orbit enumeration) with verifiers; the README says the claims remain subject to independent mathematical and software review, and that the proofs were produced in AI model sessions as reported by the maintainer. No paper; neither the repository nor Friedman's page states that the GitHub account belongs to Zhang and Zhou. The certified radii (r11 = 0.379983853..., r12 = 0.361102963...) are below the values 1/2.631 and 1/2.769 derived from Friedman's page."
  added_by: daniel-munro

krotoszynski-1993:
  string: "S. Krotoszyński, Covering a disk with smaller disks, Studia Sci. Math. Hungar. 28 (1993) 277-283."
  date: "1993"
  url: "https://zbmath.org/?q=an:0712.52017"
  notes: "Claims r(k) = 1/(1 + 2cos(2π/(k-1))) for k = 8 to 11. The proof contains errors (G. Fejes Tóth 2005), and the value is wrong for k = 11 (Melissen and Schuur, in Melissen 1997), so only the k = 11 construction is used here, as an upper bound. Read through its zbMATH review and Fejes Tóth 2005, p. 361."
  added_by: daniel-munro

gaspar-tarnai-hincz-2014:
  string: "Zs. Gáspár, T. Tarnai and K. Hincz, Partial covering of a circle by equal circles. Part I: The mechanical models, J. Comput. Geom. 5 (2014) 104-125."
  date: "2014"
  url: "https://jocg.org/index.php/jocg/article/view/2928"
  notes: "Section 1 surveys the covering problem: proofs for n = 5, 6 by Bezdek and n = 8, 9, 10 by G. Fejes Tóth; conjectured coverings for n = 11, 12 by Melissen 1997, improved by Nurmela, and for 13 <= n <= 35 by Nurmela."
  added_by: daniel-munro

nurmela-1999:
  string: "K. J. Nurmela, Circle coverings in the plane, in Proc. 7th Nordic Combinatorial Conference (Turku, 1999), TUCS General Publication 15 (1999) 71-78."
  date: "1999"
  url: "https://zbmath.org/?q=an:0969.52005"
  notes: "Not read (no copy found online). Cited by Gáspár, Tarnai and Hincz 2014 (as the 1998 Helsinki University of Technology preprint 'Covering a circle by congruent circular discs') for improving Melissen's coverings for n = 11, 12 and giving coverings for 13 <= n <= 35. Not yet cited by any row."
  added_by: daniel-munro

karakus-2026:
  string: "H. Karakuş, A counterexample to Nagamochi's scoring lemma and a new rectangle packing bound, arXiv:2609.37410."
  date: "2026-09-29"
  url: "https://arxiv.org/abs/2609.37410"
  notes: "Not peer reviewed. Shows that the proof of Nagamochi 2005's rectangle bound is incomplete (Sections 2-4), proves the weaker bound ν(a,b) < ab - Δ(a) (Theorem 1.1), and from it s(k²-1) = k for every k >= 2 (Corollary 1.2) and s(N) >= 1/2 + √(N - ⌊√N⌋ + 1/4) for nonsquare N >= 8 (Corollary 6.2), which is below Nagamochi's claimed bound at every such N. It does not reach s(k²-2) = k."
  added_by: daniel-munro

