  url: "https://math.tejstead.com/heilbronn/triangle/"
  notes: "Coordinates are given in the triangle (0, 0), (1, 0), (0, 1), and values as fractions of its area. First read 2026-11-21 (n = 3 to 36). As of 2026-11-23, n = 8, 9 and 10 are marked proved optimal by Ethan Hendren's AI-assisted computer proofs (Zenodo, November 2026), with the caveat that their certificate traces have been replayed only by their author; n = 8 is also marked numerically optimal (Sudermann-Merx, arXiv:2607.15021, a floating-point Gurobi run with a relative gap of 10^-4). The per-n record histories record coordinate refinements but not earlier records; those are from archived snapshots of the table (stead-heilbronn-triangle-2026-09-10, stead-heilbronn-triangle-2026-10-04)."
