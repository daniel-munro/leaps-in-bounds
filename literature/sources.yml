bose-nelson-1962:
  string: "R.C. Bose, R.J. Nelson, A sorting problem, Journal of the ACM 9 (1962) 282-296."
  date: "1962-04"
  doi: "https://doi.org/10.1145/321119.321126"
  notes: "Received June 1961. Theorem 5 gives a network for every n whose size f(n) satisfies f(2m) = 3f(m) + m and f(2m+1) = f(m) + 2f(m+1) + m (Theorem 3), with f(1) = 0 and f(2) = 1; Table III lists f(10) = 32, f(20) = 106 and f(30) = 198. The other values here are computed from that recurrence."
  added_by: daniel-munro

floyd-1964:
  string: "R.W. Floyd, A minute improvement in the Bose-Nelson sorting procedure, memo, Computer Associates, February 1964."
  date: "1964-02"
  notes: "Unpublished; a network for 9 inputs with 25 comparators, cited in Floyd and Knuth (1970)."
  added_by: daniel-munro

batcher-1964:
  string: "K.E. Batcher, A new internal sorting method, Goodyear Aerospace report GER-11759, September 1964."
  date: "1964-09"
  notes: "Not seen. The odd-even merge sort; sizes for 10 to 16 inputs from Table 1 of Floyd and Knuth (1970), which dates Batcher's row 1964, and for 17 to 32 inputs from the g = 2 column of Table 2 of Van Voorhis (1971), which he identifies as 'Batcher's result, B(N) = S_2(N)' (p. 48). Dating the sizes for 17 to 31 inputs by the report assumes it gave them, as Floyd and Knuth's row implies for 10 to 16. Published as Batcher (1968), which gives the size only for powers of 2 (191 for 32 inputs)."
  added_by: daniel-munro

batcher-1968:
  string: "K.E. Batcher, Sorting networks and their applications, AFIPS Spring Joint Computer Conference 32 (1968) 307-314."
  date: "1968-04-30"
  doi: "https://doi.org/10.1145/1468075.1468121"
  url: "https://www.cs.kent.edu/~batcher/sort.pdf"
  notes: "Sorts 2^p inputs in p(p+1)/2 steps, and so n inputs in that many steps for n <= 2^p, by leaving out wires. The odd-even merge sort of 2^p inputs uses (p^2 - p + 4)2^(p-2) - 1 comparators (p. 310), 191 for 32 inputs; sizes for other n aren't given. Cites Batcher's 1964 Goodyear report GER-11759 for the odd-even merge."
  added_by: daniel-munro

floyd-knuth-1970:
  string: "R.W. Floyd, D.E. Knuth, The Bose-Nelson sorting problem, Stanford report STAN-CS-70-177, November 1970. Also in A Survey of Combinatorial Theory, North-Holland (1973) 163-172."
  date: "1970-11"
  url: "http://bitsavers.informatik.uni-stuttgart.de/pdf/stanford/Stanford_CS_TR_Collection_2025-12-12/PDF/1970/CS-TR-70-177.pdf"
  doi: "https://doi.org/10.1016/B978-0-7204-2262-7.50020-X"
  notes: "Proves S(n) for n <= 8 (Theorems 3 and 4; for 7 inputs, a 1966 computer search by R. Grove). Table 1 (p. 3) gives the best upper bounds known in 1969, including unpublished networks by Waksman (10 inputs) and Shapiro and Green (11, 12 and 16 inputs), and the best lower bounds known in 1966. It also has a row 'Nelson, approx. 1956' (from the O'Connor-Nelson patent US 3029413, issued 1962-04-10, which gives no table) and a row 'Floyd and Knuth, approx. 1964' (31, 37, 41, 49, 54, 60 and 64 for 10 to 16 inputs, published as an abstract, Improved constructions for the Bose-Nelson sorting problem, Notices of the AMS 14 (1967) 283)."
  added_by: daniel-munro

kautz-pease-green-1970:
  string: "W.H. Kautz, M.C. Pease, M.W. Green, Cellular logic-in-memory arrays, Final Report Part 1, SRI Project 5509, Stanford Research Institute, May 1970."
  date: "1970-05"
  notes: "Not seen; cited by Van Voorhis (1971), Table 2, for the sizes previously reported for 17 to 32 inputs. Kautz's article of the same name (IEEE Transactions on Computers C-18 (1969) 719-727) describes the sorting arrays but gives no network sizes."
  added_by: daniel-munro

van-voorhis-1971:
  string: "D.C. Van Voorhis, A generalization of the divide-sort-merge strategy for sorting networks, Technical Report 16, Digital Systems Laboratory, Stanford University (STAN-CS-71-237), August 1971."
  date: "1971-08"
  url: "http://bitsavers.informatik.uni-stuttgart.de/pdf/stanford/Stanford_CS_TR_Collection_2025-12-12/PDF/1971/CS-TR-71-237.pdf"
  notes: "Table 2 (pp. 49-50) gives the smallest known sizes for up to 36 inputs, marking those new in the report: 79 for 18, 141 for 26, 150 for 27 and 156 for 28 inputs; the unmarked ones are credited to Kautz, Pease and Green (1970), its reference [5]. Its g = 2 column is Batcher's odd-even merge sort, 'Batcher's result, B(N) = S_2(N)' (p. 48)."
  added_by: daniel-munro

van-voorhis-1972:
  string: "D.C. Van Voorhis, An improved lower bound for sorting networks, IEEE Transactions on Computers C-21 (1972) 612-613."
  date: "1972-06"
  doi: "https://doi.org/10.1109/TC.1972.5009021"
  notes: "Proves S(n) >= S(n-1) + ceil(log2 n), first in Stanford Digital Systems Laboratory Technical Note 7 (February 1971). The resulting lower bounds for 9 to 16 inputs are from Codish et al. (2014). This one-value bound is not in question. A different paper of the same year, D.C. Van Voorhis, Toward a lower bound for sorting networks, Complexity of Computer Computations (1972) 119-129, https://doi.org/10.1007/978-1-4684-2001-2_12, follows the two largest inputs and states P(2,n) >= ceil(log2 F(n)), so that S(n) >= S(n-2) + ceil(log2 F(n)). Its proof is invalid: it assumes the comparators on the paths of the maximum are exactly n-1, which fails for 'pass-through' comparators, as in an optimal network on 3 inputs (Mericanii, Twenty tabulated lower bounds for sorting networks rest on an invalid proof: an audit of Van Voorhis (1972), and a partial repair, draft, August 2026, https://mericanii.com/work/s13/paper-correction.pdf). With Harder's S(11) = 35 that inequality gives S(13) >= 44 and the bounds Dobbelaere's list showed for 13 to 32 inputs from 2025-04-21 until it withdrew them on 2026-11-20. Tomar (2026) later proved the inequality's values for up to 32 inputs by computer, without using Van Voorhis's proof."
  added_by: daniel-munro

