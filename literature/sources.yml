bornsztein-2002:
  string: "P. Bornsztein, On an extension of a theorem of Schur, Acta Arithmetica 101 (2002) 395-399."
  date: "2002"
  doi: "https://doi.org/10.4064/aa101-4-6"
  notes: "Theorem: for n >= 2, every partition of {1, ..., [n! n e] + 1} into n classes has a class containing two different numbers and their sum, so WS(n) <= floor(n! n e)."
  added_by: daniel-munro

gowers-2001:
  string: "W.T. Gowers, A new proof of Szemerédi's theorem, Geometric and Functional Analysis 11 (2001) 465-588."
  date: "2001"
  doi: "https://doi.org/10.1007/s00039-001-0332-9"
  url: "https://www.dpmms.cam.ac.uk/~wtg10/sz898.dvi"
  notes: "Theorem 18.6: a subset of {1, ..., N} of density delta has an arithmetic progression of length k when N >= 2^2^(1/delta)^2^2^(k+9). With delta = 1/r (the largest color class), as the introduction notes, this gives W(r,k) <= 2^{2^{r^{2^{2^{k+9}}}}}; Corollary 18.7 states the case r = 2. Read in the author's preprint dated 2000-03-27."
  added_by: daniel-munro

finschi-catalog:
  string: "L. Finschi, Catalog of Isomorphism Classes of Oriented Matroids (retrieved 2026-11-16)."
  date: "2026-11-16"
  url: "https://www.finschi.com/math/om/?p=catom"
  notes: "Counts 95052532 isomorphism classes (up to relabeling and reorientation) of simple rank-3 oriented matroids on 10 elements. An arrangement of 9 affine lines, not all parallel, with the line at infinity added, is one of these with a marked element, and its combinatorial type is determined by it, so there are at most 10 * 95052532 + 1 = 950525321 combinatorial types of 9 lines, counting all lines parallel (not stated as such). The bound counts types, not the rigid isotopy classes of A241600, which can be more numerous where realization spaces are disconnected."
  added_by: daniel-munro

bjorner-et-al-1993:
  string: "A. Björner, M. Las Vergnas, B. Sturmfels, N. White and G.M. Ziegler, Oriented Matroids, Encyclopedia of Mathematics and its Applications 46, Cambridge University Press, 1993."
  date: "1993"
  doi: "https://doi.org/10.1017/CBO9780511586507"
  notes: "The combinatorial type of an arrangement of lines (its covectors) is determined by its oriented matroid, given by a chirotope on the lines and the line at infinity. A chirotope of rank 3 on m labeled elements assigns a sign in {-, 0, +} to each of the C(m, 3) triples, so there are at most 3^C(n+1, 3) combinatorial types of n affine lines. This trivial count is not stated as such."
  added_by: daniel-munro

oeis-a006248-pseudolines:
  string: "Number of simple arrangements of n pseudolines in the projective plane. - OEIS (retrieved 2026-11-16)"
  date: "2026-11-16"
  url: "https://oeis.org/A006248"
  notes: "An arrangement of n affine lines in general position, with the line at infinity added, is a simple arrangement of n + 1 projective (pseudo)lines with one of them marked, and its combinatorial type (with mirror images identified) is determined by it. So A090338(n) <= (n + 1) A006248(n + 1) (not stated as such)."
  added_by: daniel-munro

oeis-a006245-sorting-networks:
  string: "Number of primitive sorting networks on n elements; also number of rhombic tilings of a 2n-gon. - OEIS (retrieved 2026-11-16)"
  date: "2026-11-16"
  url: "https://oeis.org/A006245"
  notes: "Counts wiring diagrams: simple arrangements of n pseudolines in the plane with labeled lines and a marked unbounded cell. Every simple arrangement of n lines is isomorphic to one (Goodman), so A090338(n) <= A006245(n) (not stated as such)."
  added_by: daniel-munro

aurenhammer-2002:
  string: "F. Aurenhammer, a(11) = 41848591 of OEIS A006248, the simple arrangements of 11 pseudolines in the projective plane (2002); published in O. Aichholzer and H. Krasser, Abstract order type extension and new results on the rectilinear crossing number, Computational Geometry 36 (2007) 2-15."
  date: "2002-02-05"
  url: "https://oeis.org/A006248"
  notes: "With A090338(10) <= 11 A006248(11) (see oeis-a006248-pseudolines), at most 460334501 arrangements of 10 lines in general position."
  added_by: daniel-munro

scheucher-rote-2019:
  string: "M. Scheucher and G. Rote, a(12) = 10320613331 of OEIS A006248, the simple arrangements of 12 pseudolines in the projective plane (2019)."
  date: "2019-09-07"
  url: "https://oeis.org/A006248"
  notes: "With A090338(11) <= 12 A006248(12) (see oeis-a006248-pseudolines), at most 123847359972 arrangements of 11 lines in general position."
  added_by: daniel-munro

samuel-2011:
  string: "M.J. Samuel, Word posets, with applications to Coxeter groups, WORDS 2011, EPTCS 63 (2011) 226-230, arXiv:1108.3638."
  date: "2011-08-18"
  url: "https://arxiv.org/abs/1108.3638"
  doi: "https://doi.org/10.4204/EPTCS.63.28"
  notes: "Computes A006245(12) = 2894710651370536, the number of primitive sorting networks on 12 elements, which bounds the arrangements of 12 lines in general position (see oeis-a006245-sorting-networks)."
  added_by: daniel-munro


