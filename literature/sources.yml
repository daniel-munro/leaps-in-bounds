# Schur numbers

schur-1916:
  string: "I. Schur, Über die Kongruenz x^m + y^m ≡ z^m (mod p), Jahresbericht der Deutschen Mathematiker-Vereinigung 25 (1916) 114-117."
  date: "1916"
  url: "https://gdz.sub.uni-goettingen.de/id/PPN37721857X_0025?tify=%7B%22pages%22:%5B121%5D%7D"
  notes: "The Hilfssatz (p. 114, proved on p. 116) shows that 1, ..., N can't be split into m rows with no row containing the difference of two of its numbers once N > m! e, so S(m) <= floor(m! e): 65, 326, 1957, 13700, 109601 and 986410 for m = 4 to 9 (evaluated here). P. 117 proves S(m+1) >= 3 S(m) + 1, so S(m) >= (3^m - 1)/2, and a footnote claims without proof that equality holds only for m <= 3, which would give S(3) = 13 and S(4) >= 41; neither is recorded from it. Heule (arXiv:1711.08076) and Ageron et al. date it 1917."
  added_by: daniel-munro

golomb-baumert-1965:
  string: "S.W. Golomb and L.D. Baumert, Backtrack Programming, Journal of the ACM 12 (1965) 516-524."
  date: "1965-10"
  doi: "https://doi.org/10.1145/321296.321300"
  notes: "Not read directly (ACM blocks automated access). The computer search for S(4) is by L.D. Baumert, Sum-free sets, JPL Research Summary No. 36-10 (1961). Table 2 of Fettes, Kramer and Radziszowski (Ars Combin. 72, 2004) credits Golomb and Baumert with R_4(3) >= 46, which follows from S(4) >= 44 by S(k) <= R_k(3) - 2; the table dates it 1971 but cites this 1965 paper."
  added_by: daniel-munro

whitehead-1973:
  string: "E.G. Whitehead, The Ramsey number N(3,3,3,3;2), Discrete Mathematics 4 (1973) 389-396."
  date: "1973-04"
  doi: "https://doi.org/10.1016/0012-365X(73)90174-X"
  notes: "Received 1972-02-14 (original version 1971-09-07). Theorem 1.2 (p. 390) gives R_4(3) >= 50 from a partition of Z/7 x Z/7 found by H. Taylor, and Theorem 2.3 gives R_4(3) <= 65, called 'Folkman's Theorem' (p. 396): the proof follows Folkman's posthumous notes, with the full version in Whitehead's 1971 USC dissertation. P. 396 adds the corollary R_5(3) <= 322, which gives S(5) <= 320 by S(k) <= R_k(3) - 2 (not stated). The paper says nothing about Schur numbers: Exoo (https://doi.org/10.37236/1188) credits it with S(5) <= 321, and Irving (Acta Arithmetica 25, 1973, p. 55) attributes S(k) <= floor(k!(e - 1/24)) to Whitehead, probably to the dissertation, so those bounds are credited to irving-1973-schur here."
  added_by: daniel-munro

wan-1997:
  string: "H. Wan, Upper bounds for Ramsey numbers R(3,3,...,3) and Schur numbers, Journal of Graph Theory 26 (1997) 119-122."
  date: "1997-11"
  doi: "https://doi.org/10.1002/(SICI)1097-0118(199711)26:3<119::AID-JGT1>3.0.CO;2-U"
  notes: "[Wan] in https://doi.org/10.37236/21. Read through its summary (Zbl 0882.05095): R_n(3) < n!(e - e^{-1} + 3)/2 + 1 for n >= 4, and S_n < n!(e - e^{-1} + 3)/2 - n + 2 for even n >= 6. Evaluated here: R_7(3) <= 13484, R_8(3) <= 107865 and R_9(3) <= 970778 (for n = 5 and 6 it gives 322 and 1927, no better than the bounds from Sánchez-Flores 1995), S(6) <= 1922 and S(8) <= 107858 from the even-n bound, and S(7) <= 13482 and S(9) <= 970776 from S(n) <= R_n(3) - 2. Whether S_n is the largest n with a partition or one more isn't clear from the summary; the values used hold either way."
  added_by: daniel-munro

eliahou-2016-schur:
  string: "S. Eliahou, Les nombres de Schur, des centenaires pleins d'avenir, Images des Mathématiques, CNRS (2016)."
  date: "2016-12"
  url: "https://images.math.cnrs.fr/freeze/Les-nombres-de-Schur-des-centenaires-pleins-d-avenir.html"
  notes: "States that S(5) lies between 160 and 305 (section 'Valeurs connues'), without a reference; 305 is R_5(3) - 2 with R_5(3) <= 307 from Fettes, Kramer and Radziszowski. The page has no date; it mentions an October 2016 colloquium and its first comment is dated 2016-12-21."
  added_by: daniel-munro

fredricksen-1979:
  string: "H. Fredricksen, Schur numbers and the Ramsey numbers N(3,3,...,3;2), Journal of Combinatorial Theory, Series A 27 (1979) 376-377."
  date: "1979-11"
  doi: "https://doi.org/10.1016/0097-3165(79)90028-1"
  notes: "Received 1978-03-28. Lists a partition of 1-157 into five sum-free sets, so S(5) >= 157, and states N(3,3,3,3,3;2) > 158, i.e. R_5(3) >= 159. It says this improves earlier lower bounds, citing H. Fredricksen, Five sum-free sets, Proc. 6th Southeastern Conf. on Combinatorics, Graph Theory and Computing (1975) 309-314, which wasn't found."
  added_by: daniel-munro

exoo-1994:
